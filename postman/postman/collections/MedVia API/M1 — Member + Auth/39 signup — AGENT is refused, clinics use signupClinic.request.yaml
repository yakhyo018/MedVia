$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation Signup($input: MemberInput!) {
        signup(input: $input) {
          _id
          memberType
          memberAuthType
          memberEmail
          memberFullName
          memberLang
          memberMustChangePassword
          memberNotify { bookingUpdates visitReminders chatMessages }
          memberTermsAt
          accessToken
        }
      }
    variables: |-
      {
        "input": {
          "memberType": "AGENT",
          "memberEmail": "{{clinicEmail}}",
          "memberPassword": "{{patientPassword}}",
          "memberFullName": "Kim Ji-won",
          "memberLang": "KO",
          "termsAccepted": true
        }
      }
scripts:
  - type: beforeRequest
    code: pm.environment.set('clinicEmail', 'clinic.' + Date.now() + '@medvia.test');
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      // Since M2 a clinic account is created only together with its clinic (signupClinic).
      pm.test('refused: clinics sign up with signupClinic', () => pm.expect(msg).to.include('clinics sign up with signupClinic'));
      pm.test('no account created', () => pm.expect(gql.signup).to.not.be.ok);
    language: text/javascript
order: 39000
