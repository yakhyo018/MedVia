$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation Signup($input: MemberInput!) {
        signup(input: $input) {
          _id
          memberType
          memberAuthType
          memberEmail
          memberFullName
          memberLang
          memberMustChangePassword
          memberNotify { bookingUpdates visitReminders chatMessages }
          memberTermsAt
          accessToken
        }
      }
    variables: |-
      {
        "input": {
          "memberType": "USER",
          "memberEmail": "{{secondEmail}}",
          "memberPassword": "{{patientPassword}}",
          "memberFullName": "Aziza Karimova",
          "memberLang": "RU",
          "termsAccepted": true
        }
      }
scripts:
  - type: beforeRequest
    code: |-
      pm.environment.set('secondEmail', 'second.' + Date.now() + '@medvia.test');
      pm.environment.set('secondPassword', 'Patient#2026');
      pm.environment.set('secondNewPassword', 'Patient#2027');
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.environment.set('secondToken', (gql.signup || {}).accessToken || '');
    language: text/javascript
order: 20000
