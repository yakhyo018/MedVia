$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation RefreshToken {
        refreshToken { _id memberEmail accessToken }
      }
scripts:
  - type: beforeRequest
    code: |-
      const jar = pm.cookies.jar();
      jar.set(pm.environment.get('baseUrl') + '/graphql',
        { name: 'medvia_rt', value: pm.environment.get('rtFirst') || 'missing', path: '/graphql', httpOnly: true },
        (e) => { if (e) console.log('cookie jar error', e); });
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const m = gql.refreshToken || {};
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('new access token', () => pm.expect(m.accessToken).to.be.a('string').and.not.eql(pm.environment.get('patientToken')));
      const rt = pm.cookies.get('medvia_rt');
      pm.test('refresh cookie replaced by a new one', () => pm.expect(rt).to.be.a('string').and.not.eql(pm.environment.get('rtFirst')));
      pm.environment.set('rtSecond', rt || '');
      pm.environment.set('patientToken', m.accessToken || '');
    language: text/javascript
order: 14000
