$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation Signup($input: MemberInput!) {
        signup(input: $input) {
          _id
          memberType
          memberAuthType
          memberEmail
          memberFullName
          memberLang
          memberMustChangePassword
          memberNotify { bookingUpdates visitReminders chatMessages }
          memberTermsAt
          accessToken
        }
      }
    variables: |-
      {
        "input": {
          "memberType": "USER",
          "memberEmail": "{{blockEmail}}",
          "memberPassword": "{{patientPassword}}",
          "memberFullName": "Feride Karimova",
          "memberLang": "RU",
          "termsAccepted": true
        }
      }
scripts:
  - type: beforeRequest
    code: pm.environment.set('blockEmail', 'block.' + Date.now() + '@medvia.test');
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const m = gql.signup || {};
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.environment.set('blockToken', m.accessToken || '');
      pm.environment.set('blockMemberId', m._id || '');
    language: text/javascript
order: 33000
