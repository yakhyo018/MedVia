$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation Login($input: LoginInput!) {
        login(input: $input) { _id memberType memberEmail memberLastLoginAt accessToken }
      }
    variables: |-
      {
        "input": {
          "memberEmail": "{{throttleEmail}}",
          "memberPassword": "wrong-password"
        }
      }
scripts:
  - type: beforeRequest
    code: |-
      // Five wrong attempts first; this request is the sixth.
      const email = 'throttle.' + Date.now() + '@medvia.test';
      pm.environment.set('throttleEmail', email);
      const url = pm.environment.get('baseUrl') + '/graphql';
      const raw = JSON.stringify({
        query: 'mutation($input: LoginInput!){ login(input: $input){ _id } }',
        variables: { input: { memberEmail: email, memberPassword: 'wrong-password' } },
      });
      let sent = 0;
      const next = () => {
        if (sent++ >= 5) return;
        pm.sendRequest({ url, method: 'POST', header: { 'Content-Type': 'application/json' }, body: { mode: 'raw', raw } }, next);
      };
      next();
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      pm.test('refused, message mentions "Too Many Requests"', () => pm.expect(msg).to.include('Too Many Requests'));
    language: text/javascript
order: 41000
