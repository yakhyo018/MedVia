$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation Signup($input: MemberInput!) {
        signup(input: $input) {
          _id
          memberType
          memberAuthType
          memberEmail
          memberFullName
          memberLang
          memberMustChangePassword
          memberNotify { bookingUpdates visitReminders chatMessages }
          memberTermsAt
          accessToken
        }
      }
    variables: |-
      {
        "input": {
          "memberType": "USER",
          "memberEmail": "{{patientEmail}}",
          "memberPassword": "{{patientPassword}}",
          "memberFullName": "Aziza Karimova",
          "memberLang": "RU",
          "termsAccepted": true
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      pm.test('refused: This email address is already registered!', () => pm.expect(msg).to.eql('This email address is already registered!'));
    language: text/javascript
order: 2000
