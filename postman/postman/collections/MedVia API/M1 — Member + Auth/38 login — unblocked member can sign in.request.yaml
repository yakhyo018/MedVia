$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation Login($input: LoginInput!) {
        login(input: $input) { _id memberType memberEmail memberLastLoginAt accessToken }
      }
    variables: |-
      {
        "input": {
          "memberEmail": "{{blockEmail}}",
          "memberPassword": "{{patientPassword}}"
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('access token returned', () => pm.expect((gql.login || {}).accessToken).to.be.a('string'));
    language: text/javascript
order: 38000
