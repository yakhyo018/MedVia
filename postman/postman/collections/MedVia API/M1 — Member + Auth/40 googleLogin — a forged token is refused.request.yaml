$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation GoogleLogin($input: GoogleLoginInput!) {
        googleLogin(input: $input) { _id accessToken }
      }
    variables: |-
      {
        "input": {
          "idToken": "forged.header.signature",
          "termsAccepted": true
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      pm.test('refused', () => pm.expect([
        'Google sign-in failed, please try again!',
        'Google sign-in is not configured on this server!',
      ]).to.include(msg));
      pm.test('no token handed out', () => pm.expect(gql.googleLogin == null).to.be.true);
    language: text/javascript
order: 40000
