$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      query Members($input: MembersInquiry!) {
        getAllMembersByAdmin(input: $input) {
          list { _id memberEmail memberType memberStatus }
          metaCounter { total }
        }
      }
    variables: |-
      {
        "input": {
          "page": 1,
          "limit": 10,
          "sort": "createdAt",
          "direction": "DESC",
          "search": {
            "memberType": "USER",
            "text": "{{patientEmail}}"
          }
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const r = gql.getAllMembersByAdmin || {};
      const list = r.list || [];
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('exactly one match', () => pm.expect(list).to.have.length(1));
      pm.test('it is our patient', () => pm.expect((list[0] || {}).memberEmail).to.eql(pm.environment.get('patientEmail').toLowerCase()));
      pm.test('metaCounter total is 1', () => pm.expect(((r.metaCounter || [])[0] || {}).total).to.eql(1));
    language: text/javascript
order: 32000
