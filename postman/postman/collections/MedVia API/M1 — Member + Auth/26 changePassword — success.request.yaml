$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{secondToken}}
body:
  type: graphql
  content:
    query: |-
      mutation ChangePassword($input: ChangePasswordInput!) {
        changePassword(input: $input) { _id memberMustChangePassword accessToken }
      }
    variables: |-
      {
        "input": {
          "currentPassword": "{{secondPassword}}",
          "newPassword": "{{secondNewPassword}}"
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const m = gql.changePassword || {};
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('this device gets a fresh access token', () => pm.expect(m.accessToken).to.be.a('string').and.not.eql(pm.environment.get('secondToken')));
      pm.test('must-change flag cleared', () => pm.expect(m.memberMustChangePassword).to.eql(false));
      pm.environment.set('secondOldToken', pm.environment.get('secondToken'));
      pm.environment.set('secondToken', m.accessToken || '');
    language: text/javascript
order: 26000
