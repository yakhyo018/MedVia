$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation RefreshToken {
        refreshToken { _id memberEmail accessToken }
      }
scripts:
  - type: beforeRequest
    code: |-
      const jar = pm.cookies.jar();
      jar.set(pm.environment.get('baseUrl') + '/graphql',
        { name: 'medvia_rt', value: pm.environment.get('rtSecond') || 'missing', path: '/graphql', httpOnly: true },
        (e) => { if (e) console.log('cookie jar error', e); });
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const m = gql.refreshToken || {};
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('session survived the quick replay (two tabs racing)', () => pm.expect(m.accessToken).to.be.a('string'));
      pm.environment.set('rtThird', pm.cookies.get('medvia_rt') || '');
      pm.environment.set('patientToken', m.accessToken || '');
    language: text/javascript
order: 16000
