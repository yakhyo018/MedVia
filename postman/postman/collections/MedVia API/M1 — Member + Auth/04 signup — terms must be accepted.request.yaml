$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation Signup($input: MemberInput!) {
        signup(input: $input) {
          _id
          memberType
          memberAuthType
          memberEmail
          memberFullName
          memberLang
          memberMustChangePassword
          memberNotify { bookingUpdates visitReminders chatMessages }
          memberTermsAt
          accessToken
        }
      }
    variables: |-
      {
        "input": {
          "memberType": "USER",
          "memberEmail": "{{tmpEmail}}",
          "memberPassword": "{{patientPassword}}",
          "memberFullName": "Aziza Karimova",
          "memberLang": "RU",
          "termsAccepted": false
        }
      }
scripts:
  - type: beforeRequest
    code: pm.environment.set('tmpEmail', 'no.terms.' + Date.now() + '@medvia.test');
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      pm.test('refused, message mentions "termsAccepted must be true"', () => pm.expect(msg).to.include('termsAccepted must be true'));
    language: text/javascript
order: 4000
