$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{secondToken}}
body:
  type: graphql
  content:
    query: |-
      mutation ChangePassword($input: ChangePasswordInput!) {
        changePassword(input: $input) { _id accessToken }
      }
    variables: |-
      {
        "input": {
          "currentPassword": "not-the-password",
          "newPassword": "{{secondNewPassword}}"
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      pm.test('refused: The current password is incorrect!', () => pm.expect(msg).to.eql('The current password is incorrect!'));
    language: text/javascript
order: 25000
