$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation Login($input: LoginInput!) {
        login(input: $input) { _id memberType memberEmail memberLastLoginAt accessToken }
      }
    variables: |-
      {
        "input": {
          "memberEmail": "{{patientEmail}}",
          "memberPassword": "not-the-password"
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      pm.test('refused: Wrong email or password!', () => pm.expect(msg).to.eql('Wrong email or password!'));
    language: text/javascript
order: 7000
