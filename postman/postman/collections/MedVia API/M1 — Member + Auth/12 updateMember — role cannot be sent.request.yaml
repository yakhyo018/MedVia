$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation UpdateMember($input: MemberUpdate!) {
        updateMember(input: $input) { memberType }
      }
    variables: |-
      {
        "input": {
          "memberType": "ADMIN"
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      pm.test('refused by the GraphQL schema itself', () => pm.expect(msg).to.include('memberType'));
      pm.test('nothing was returned', () => pm.expect(body.data == null || gql.updateMember == null).to.be.true);
    language: text/javascript
order: 12000
