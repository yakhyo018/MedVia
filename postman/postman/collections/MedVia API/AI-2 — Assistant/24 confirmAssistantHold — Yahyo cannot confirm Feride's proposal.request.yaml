$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patient2Token}}
body:
  type: graphql
  content:
    query: |-
      mutation C($id: String!) { confirmAssistantHold(sessionId: $id) { slotIds slotStart holdExpiresAt } }
    variables: |-
      { "id": "{{sessionId}}" }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test("refused: There is no time waiting for your confirmation, or it has expired!", () => pm.expect(msg).to.include("There is no time waiting for your confirmation, or it has expired!"));
      pm.test('code BAD_REQUEST', () => pm.expect(code).to.eql('BAD_REQUEST'));
    language: text/javascript
order: 24000
