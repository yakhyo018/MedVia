$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation X($id: String!) { closeAssistantSession(sessionId: $id) { _id sessionStatus } }
    variables: |-
      { "id": "{{sessionId}}" }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('CLOSED', () => pm.expect((gql.closeAssistantSession || {}).sessionStatus).to.eql('CLOSED'));
    language: text/javascript
order: 37000
