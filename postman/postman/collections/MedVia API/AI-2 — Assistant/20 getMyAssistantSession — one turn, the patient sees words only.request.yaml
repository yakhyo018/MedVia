$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      query { getMyAssistantSession { _id sessionStatus sessionLang turnCount turns { role text } pendingHold { label } } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const s = gql.getMyAssistantSession || {};
      pm.test('1 turn, RU, user then assistant', () => pm.expect([s.turnCount, s.sessionLang, (s.turns || []).map((t) => t.role)]).to.eql([1, 'RU', ['user', 'assistant']]));
    language: text/javascript
order: 20000
