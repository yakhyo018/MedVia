$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patient2Token}}
body:
  type: graphql
  content:
    query: |-
      mutation A($input: AssistantMessageInput!) { sendAssistantMessage(input: $input) { sessionId text toolsUsed clinics { clinicId clinicName district rating minPriceKrw } slots { treatmentId doctorId slotStart label } pendingHold { treatmentId doctorId slotStart label clinicName treatmentName priceKrw expiresAt } } }
    variables: |-
      { "input": { "text": "hello" } }
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.environment.get('sent')) pm.environment.set('sent', '0');
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      const sent = Number(pm.environment.get('sent') || 0) + 1;
      if (!body.errors && sent < 40) {
        pm.environment.set('sent', String(sent));
        if (pm.execution && pm.execution.setNextRequest) pm.execution.setNextRequest(pm.info.requestName);
        else postman.setNextRequest(pm.info.requestName);
      } else {
        pm.environment.unset('sent');
        pm.test('the 31st message of the day is refused', () => pm.expect([sent + 1, msg]).to.eql([31, 'You have reached today’s limit for the assistant!']));
      }
    language: text/javascript
order: 40000
