$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      query L($input: ClinicsInquiry!) { getClinics(input: $input) { list { _id } } }
    variables: |-
      { "input": { "page": 1, "limit": 5, "search": { "text": "{{token}}" } } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const found = ((gql.getClinics || {}).list || []).some((c) => c._id === pm.environment.get('clinicId'));
      const tries = Number(pm.environment.get('searchTries') || 0);
      if (!found && tries < 15) {
        pm.environment.set('searchTries', String(tries + 1));
        setTimeout(() => {}, 1500);
        if (pm.execution && pm.execution.setNextRequest) pm.execution.setNextRequest(pm.info.requestName);
        else postman.setNextRequest(pm.info.requestName);
      } else {
        pm.environment.unset('searchTries');
        pm.test('the clinic is searchable', () => pm.expect(found).to.be.true);
      }
    language: text/javascript
order: 13000
