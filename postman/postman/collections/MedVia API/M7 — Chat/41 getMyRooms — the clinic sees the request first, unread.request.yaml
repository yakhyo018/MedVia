$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      query R { getMyRooms { _id roomLastAt unread lastText memberId clinicId clinicName patientName patientLang } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const rooms = gql.getMyRooms || [];
      pm.test('two rooms, Yahyo on top with 1 unread', () => pm.expect([rooms.length, (rooms[0] || {}).patientName, (rooms[0] || {}).unread]).to.eql([2, 'Yahyo C.', 1]));
    language: text/javascript
order: 41000
