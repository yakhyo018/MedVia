$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation MR($id: String!) { markRoomRead(roomId: $id) { _id roomLastAt unread lastText memberId clinicId clinicName patientName patientLang } }
    variables: |-
      { "id": "{{roomId}}" }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('0 unread for the clinic', () => pm.expect((gql.markRoomRead || {}).unread).to.eql(0));
    language: text/javascript
order: 33000
