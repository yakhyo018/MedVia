$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patient2Token}}
body:
  type: graphql
  content:
    query: |-
      mutation S($input: MessageSendInput!) { sendMessage(input: $input) { _id messageType senderType messageText messageLang messageTranslationStatus displayText roomId senderId createdAt } }
    variables: |-
      { "input": { "roomId": "{{roomId}}", "messageText": "Hello" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test("refused: No data is found!", () => pm.expect(msg).to.include("No data is found!"));
      pm.test('code NOT_FOUND', () => pm.expect(code).to.eql('NOT_FOUND'));
    language: text/javascript
order: 20000
