$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      query R { getMyRooms { _id roomLastAt unread lastText memberId clinicId clinicName patientName patientLang } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const r = (gql.getMyRooms || [])[0] || {};
      pm.test('1 unread, original shown until AI-1 translates', () => pm.expect([r.unread, r.lastText]).to.eql([1, "네, 내일 14시에 가능합니다."]));
    language: text/javascript
order: 32000
