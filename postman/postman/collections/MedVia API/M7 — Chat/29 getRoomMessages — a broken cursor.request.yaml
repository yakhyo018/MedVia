$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      query M($input: RoomMessagesInquiry!) { getRoomMessages(input: $input) { list { _id messageType senderType messageText messageLang messageTranslationStatus displayText roomId senderId createdAt } nextCursor } }
    variables: |-
      { "input": { "roomId": "{{roomId}}", "limit": 2, "before": "not-a-cursor" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test("refused: Bad request!", () => pm.expect(msg).to.include("Bad request!"));
      pm.test('code BAD_REQUEST', () => pm.expect(code).to.eql('BAD_REQUEST'));
    language: text/javascript
order: 29000
