$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation O($id: String!) { openRoom(clinicId: $id) { _id roomLastAt unread lastText memberId clinicId clinicName patientName patientLang } }
    variables: |-
      { "id": "{{clinicId}}" }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const r = gql.openRoom || {};
      pm.test('empty room with the clinic card', () => pm.expect([r.unread, r.lastText, r.clinicName]).to.eql([0, null, 'Chat Test Clinic ' + pm.environment.get('stamp')]));
      pm.environment.set('roomId', r._id || '');
    language: text/javascript
order: 17000
