$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation SignupClinic($input: ClinicSignupInput!) { signupClinic(input: $input) { _id accessToken } }
    variables: |-
      {
        "input": {
          "memberEmail": "cclinic.{{stamp}}@medvia.test", "memberPassword": "Clinic#2026", "memberFullName": "Kim Ji-won",
          "clinicName": "Chat Test Clinic {{stamp}}", "clinicSpecialty": "DERMATOLOGY", "clinicDistrict": "GANGNAM",
          "clinicAddress": "12 Teheran-ro, Gangnam-gu, Seoul", "termsAccepted": true, "authorizedConfirmed": true
        }
      }
scripts:
  - type: beforeRequest
    code: |-
      const stamp = Date.now();
      pm.environment.set('stamp', String(stamp));
      pm.environment.set('cTreatmentName', 'Glow Facial ck' + stamp.toString(36));
      const DAY = 86400000;
      const slotDate = new Date(stamp + 9 * 3600000 + 3 * DAY).toISOString().slice(0, 10);
      pm.environment.set('slotDate', slotDate);
      pm.environment.set('t1000', new Date(slotDate + 'T10:00:00+09:00').toISOString());
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.environment.set('clinicToken', (gql.signupClinic || {}).accessToken || '');
    language: text/javascript
order: 1000
