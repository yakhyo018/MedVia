$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patient2Token}}
body:
  type: graphql
  content:
    query: |-
      query R { getMyRooms { _id roomLastAt unread lastText memberId clinicId clinicName patientName patientLang } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const r = (gql.getMyRooms || [])[0] || {};
      pm.environment.set('yahyoRoomId', r._id || '');
      const line = 'Booking request · ' + pm.environment.get('cTreatmentName') + ' · ' + pm.environment.get('slotDate') + ' 10:00 KST';
      pm.test('the request line, nothing unread for Yahyo', () => pm.expect([r.lastText, r.unread]).to.eql([line, 0]));
    language: text/javascript
order: 40000
