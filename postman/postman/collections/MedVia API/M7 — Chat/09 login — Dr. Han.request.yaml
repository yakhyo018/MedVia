$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation Login($input: LoginInput!) { login(input: $input) { accessToken } }
    variables: |-
      { "input": { "memberEmail": "cdoc.{{stamp}}@medvia.test", "memberPassword": "Temp#2026" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.environment.set('doctorToken', (gql.login || {}).accessToken || '');
    language: text/javascript
order: 9000
