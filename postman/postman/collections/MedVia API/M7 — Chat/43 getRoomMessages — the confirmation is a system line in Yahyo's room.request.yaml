$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patient2Token}}
body:
  type: graphql
  content:
    query: |-
      query M($input: RoomMessagesInquiry!) { getRoomMessages(input: $input) { list { _id messageType senderType messageText messageLang messageTranslationStatus displayText roomId senderId createdAt } nextCursor } }
    variables: |-
      { "input": { "roomId": "{{yahyoRoomId}}", "limit": 10 } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const list = (gql.getRoomMessages || {}).list || [];
      pm.test('confirmed, then requested', () => pm.expect(list.map((m) => m.messageText.split(' · ')[0])).to.eql(['Booking confirmed', 'Booking request']));
      pm.test('SYSTEM lines with no sender', () => pm.expect(list.map((m) => [m.messageType, m.senderType, m.senderId])).to.eql([['SYSTEM', 'SYSTEM', null], ['SYSTEM', 'SYSTEM', null]]));
    language: text/javascript
order: 43000
