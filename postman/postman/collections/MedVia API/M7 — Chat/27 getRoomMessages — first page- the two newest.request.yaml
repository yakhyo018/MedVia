$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      query M($input: RoomMessagesInquiry!) { getRoomMessages(input: $input) { list { _id messageType senderType messageText messageLang messageTranslationStatus displayText roomId senderId createdAt } nextCursor } }
    variables: |-
      { "input": { "roomId": "{{roomId}}", "limit": 2 } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const p = gql.getRoomMessages || {};
      pm.test('newest first', () => pm.expect((p.list || []).map((m) => m.messageText)).to.eql(["Спасибо!", "Нужно ли что-то подготовить?"]));
      pm.test('there is an older page', () => pm.expect(p.nextCursor).to.be.a('string').and.not.empty);
      pm.environment.set('cursor', p.nextCursor || '');
    language: text/javascript
order: 27000
