$kind: http-request
url: '{{batchUrl}}/dev/run/RECOUNT'
method: POST
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json(); } catch (e) { return {}; } })();
      pm.test('status 201', () => pm.response.to.have.status(201));
      pm.test('RECOUNT SUCCESS', () => pm.expect([body.batchName, body.batchStatus], body.batchResult).to.eql(['RECOUNT', 'SUCCESS']));
      pm.test('logged with start and finish', () => pm.expect([!!body._id, !!body.startedAt, !!body.finishedAt]).to.eql([true, true, true]));
      pm.test('fixed 0 clinics, 0 doctors', () => pm.expect(body.batchResult).to.match(/^clinics: fixed 0 of \d+; doctors: fixed 0 of \d+$/));
    language: text/javascript
order: 77000
