$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      query L($input: ClinicsInquiry!) { getClinics(input: $input) { list { _id clinicScore } } }
    variables: |-
      { "input": { "page": 1, "limit": 50, "sort": "clinicScore" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const scores = ((gql.getClinics || {}).list || []).map((c) => c.clinicScore);
      pm.test('a page of clinics', () => pm.expect(scores.length).to.be.above(0));
      pm.test('non-increasing', () => pm.expect(scores).to.eql([...scores].sort((a, b) => b - a)));
    language: text/javascript
order: 80000
