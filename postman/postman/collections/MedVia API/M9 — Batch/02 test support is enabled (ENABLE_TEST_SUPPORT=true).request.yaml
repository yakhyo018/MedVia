$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      { __type(name: "Mutation") { fields { name } } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      const names = ((gql.__type || {}).fields || []).map((f) => f.name);
      pm.test('devPromoteJob exists — add ENABLE_TEST_SUPPORT=true to .env and restart the API', () => pm.expect(names).to.include('devPromoteJob'));
    language: text/javascript
order: 2000
