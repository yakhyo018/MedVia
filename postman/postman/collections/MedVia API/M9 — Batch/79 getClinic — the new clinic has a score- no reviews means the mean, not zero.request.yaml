$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      query C($id: String!) { getClinic(clinicId: $id) { _id clinicFollowers clinicMinPrice clinicTreatmentNames clinicRating clinicReviews clinicScore } }
    variables: |-
      { "id": "{{clinicId}}" }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('between 0 and 1', () => pm.expect((gql.getClinic || {}).clinicScore).to.be.above(0).and.at.most(1));
    language: text/javascript
order: 79000
