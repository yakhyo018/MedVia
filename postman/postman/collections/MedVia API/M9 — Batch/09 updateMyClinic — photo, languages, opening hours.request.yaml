$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation U($input: ClinicUpdate!) { updateMyClinic(input: $input) { _id } }
    variables: |-
      { "input": { "clinicImages": ["{{clinicImage}}"], "clinicLangs": ["KO", "EN", "RU", "UZ"], "clinicHours": [ { "day": 0, "open": "09:00", "close": "19:00" }, { "day": 1, "open": "09:00", "close": "19:00" }, { "day": 2, "open": "09:00", "close": "19:00" }, { "day": 3, "open": "09:00", "close": "19:00" }, { "day": 4, "open": "09:00", "close": "19:00" }, { "day": 5, "open": "09:00", "close": "19:00" }, { "day": 6, "open": "09:00", "close": "19:00" } ] } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
    language: text/javascript
order: 9000
