$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      query C($id: String!) { getClinic(clinicId: $id) { _id clinicFollowers clinicMinPrice clinicTreatmentNames clinicRating clinicReviews clinicScore } }
    variables: |-
      { "id": "{{clinicId}}" }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const c = gql.getClinic || {};
      pm.test('1 follower (Feride)', () => pm.expect(c.clinicFollowers).to.eql(1));
      pm.test('from 99 000, one live treatment', () => pm.expect([c.clinicMinPrice, c.clinicTreatmentNames]).to.eql([99000, ['Laser Toning ' + pm.environment.get('token')]]));
      pm.test('no reviews yet', () => pm.expect([c.clinicRating, c.clinicReviews]).to.eql([0, 0]));
    language: text/javascript
order: 76000
