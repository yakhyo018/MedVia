$kind: http-request
url: '{{batchUrl}}/dev/run/RANK'
method: POST
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json(); } catch (e) { return {}; } })();
      pm.test('status 201', () => pm.response.to.have.status(201));
      pm.test('RANK SUCCESS', () => pm.expect([body.batchName, body.batchStatus], body.batchResult).to.eql(['RANK', 'SUCCESS']));
      pm.test('logged with start and finish', () => pm.expect([!!body._id, !!body.startedAt, !!body.finishedAt]).to.eql([true, true, true]));
      pm.test('ranked', () => pm.expect(body.batchResult).to.match(/^clinics: \d+ ranked, \d+ changed; doctors: \d+ ranked, \d+ changed$/));
    language: text/javascript
order: 78000
