$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patient2Token}}
body:
  type: graphql
  content:
    query: |-
      mutation UM($input: MemberUpdate!) { updateMember(input: $input) { memberNotify { bookingUpdates visitReminders } } }
    variables: |-
      { "input": { "memberNotify": { "visitReminders": false } } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('reminders off, booking updates on', () => pm.expect((gql.updateMember || {}).memberNotify).to.eql({ bookingUpdates: true, visitReminders: false }));
    language: text/javascript
order: 48000
