$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      mutation S($id: String!, $hours: Int!) { devShiftBookingTime(bookingId: $id, hours: $hours) }
    variables: |-
      { "id": "{{bookingFId}}", "hours": {{shiftHours}} }
scripts:
  - type: beforeRequest
    code: |-
      const visit = Date.parse(pm.environment.get('t1200'));
      pm.environment.set('shiftHours', String(Math.floor((visit - Date.now()) / 3600000) - 11));
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
    language: text/javascript
order: 52000
