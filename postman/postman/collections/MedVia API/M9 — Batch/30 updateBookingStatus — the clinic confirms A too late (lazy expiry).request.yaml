$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation U($input: BookingStatusUpdate!) { updateBookingStatus(input: $input) { _id bookingStatus } }
    variables: |-
      { "input": { "bookingId": "{{bookingAId}}", "bookingStatus": "CONFIRMED" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test("refused: The time to answer this request has passed!", () => pm.expect(msg).to.include("The time to answer this request has passed!"));
      pm.test('code BAD_REQUEST', () => pm.expect(code).to.eql('BAD_REQUEST'));
    language: text/javascript
order: 30000
