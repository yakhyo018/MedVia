$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation CB($input: BookingCreateInput!) { createBooking(input: $input) { _id bookingStatus } }
    variables: |-
      { "input": { "treatmentId": "{{treatmentId}}", "doctorId": "{{doctorAId}}", "slotStart": "{{t1300}}", "bookingLang": "RU", "questionnaire": { "originalLang": "RU", "answers": [ { "question": "Concern", "answer": "Пигментация" } ] }, "consents": [ { "consentType": "SHARE_DATA", "agreed": true }, { "consentType": "BOOKING_TERMS", "agreed": true } ] } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('PENDING', () => pm.expect((gql.createBooking || {}).bookingStatus).to.eql('PENDING'));
      pm.environment.set('bookingGId', (gql.createBooking || {})._id || '');
    language: text/javascript
order: 57000
