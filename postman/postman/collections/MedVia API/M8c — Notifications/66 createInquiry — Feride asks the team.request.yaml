$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation CI($input: InquiryInput!) { createInquiry(input: $input) { _id inquiryStatus } }
    variables: |-
      { "input": { "inquiryCategory": "BOOKING", "inquiryTitle": "Can I get an interpreter? {{token}}", "inquiryContent": "Нужен переводчик на визит.", "inquiryLang": "RU" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.environment.set('inquiryId', (gql.createInquiry || {})._id || '');
    language: text/javascript
order: 66000
