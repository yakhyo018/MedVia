$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation MR($input: NotificationsReadInput!) { markNotificationsRead(input: $input) }
    variables: |-
      { "input": { "notificationIds": ["not-an-id"] } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test("refused: each value in notificationIds must be a mongodb id", () => pm.expect(msg).to.include("each value in notificationIds must be a mongodb id"));
    language: text/javascript
order: 75000
