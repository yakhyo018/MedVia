$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation C($input: ArticleInput!) { createArticle(input: $input) { _id } }
    variables: |-
      { "input": { "articleCategory": "QNA", "articleTitle": "Does laser toning help melasma? {{token}}", "articleContent": "I read that some lasers make it worse.", "articleLang": "RU" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.environment.set('articleId', (gql.createArticle || {})._id || '');
    language: text/javascript
order: 61000
