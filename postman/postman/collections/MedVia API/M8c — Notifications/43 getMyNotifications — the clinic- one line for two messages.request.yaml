$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      query N($input: NotificationsInquiry!) { getMyNotifications(input: $input) { list { _id notificationType notificationStatus notificationGroup notificationTitle notificationDesc notificationParamsJson notificationCount notificationRefId authorId receiverId } metaCounter { total } } }
    variables: |-
      { "input": { "page": 1, "limit": 50, "notificationGroup": "CHAT" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const list = (gql.getMyNotifications || {}).list || [];
      const env = (key) => pm.environment.get(key);
      const one = (type, refKey) => list.find((n) => n.notificationType === type && n.notificationRefId === env(refKey)) || {};
      const params = (n) => { try { return JSON.parse(n.notificationParamsJson || '{}'); } catch (e) { return {}; } };
      pm.test('1 lines', () => pm.expect(list.length, JSON.stringify(list.map((n) => n.notificationType))).to.eql(1));
      const n = one('NEW_MESSAGE', 'roomId');
      pm.test('from Feride K. (a patient shows as first name + initial)', () => pm.expect(n.notificationTitle).to.eql('New message from Feride K.'));
      pm.test('count 2, unread', () => pm.expect([n.notificationCount, n.notificationStatus]).to.eql([2, 'WAIT']));
      pm.test('the preview is the latest message', () => pm.expect(n.notificationDesc).to.eql('Можно в 15:30? ' + env('token')));
      pm.environment.set('chatLineId', n._id || '');
    language: text/javascript
order: 43000
