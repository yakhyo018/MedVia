$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{doctorToken}}
body:
  type: graphql
  content:
    query: |-
      mutation CC($input: CommentInput!) { createComment(input: $input) { _id authorName } }
    variables: |-
      { "input": { "articleId": "{{articleId}}", "commentContent": "Low-fluence toning is safe for melasma when spaced 2 weeks apart.", "commentLang": "EN" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
    language: text/javascript
order: 64000
