$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      query N($input: NotificationsInquiry!) { getMyNotifications(input: $input) { list { _id notificationType notificationStatus notificationGroup notificationTitle notificationDesc notificationParamsJson notificationCount notificationRefId authorId receiverId } metaCounter { total } } }
    variables: |-
      { "input": { "page": 1, "limit": 50, "notificationGroup": "COMMUNITY" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const list = (gql.getMyNotifications || {}).list || [];
      const env = (key) => pm.environment.get(key);
      const one = (type, refKey) => list.find((n) => n.notificationType === type && n.notificationRefId === env(refKey)) || {};
      const params = (n) => { try { return JSON.parse(n.notificationParamsJson || '{}'); } catch (e) { return {}; } };
      pm.test('2 lines — her own comment rang nothing', () => pm.expect(list.length, JSON.stringify(list.map((n) => n.notificationType))).to.eql(2));
      const title = 'Does laser toning help melasma? ' + env('token');
      pm.test('a comment from Yahyo C.', () => pm.expect(one('ARTICLE_COMMENT', 'articleId').notificationDesc).to.eql('Yahyo C. · ' + title));
      pm.test('a doctor answered', () => pm.expect([one('DOCTOR_ANSWERED', 'articleId').notificationTitle, one('DOCTOR_ANSWERED', 'articleId').notificationDesc]).to.eql(['A doctor answered your question', 'Dr. Han Seo-yeon · ' + title]));
    language: text/javascript
order: 65000
