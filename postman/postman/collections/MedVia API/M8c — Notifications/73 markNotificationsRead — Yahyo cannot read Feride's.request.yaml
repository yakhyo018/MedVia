$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patient2Token}}
body:
  type: graphql
  content:
    query: |-
      mutation MR($input: NotificationsReadInput!) { markNotificationsRead(input: $input) }
    variables: |-
      { "input": { "notificationIds": ["{{notifAId}}"] } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('0 changed', () => pm.expect(gql.markNotificationsRead).to.eql(0));
    language: text/javascript
order: 73000
