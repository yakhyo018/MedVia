$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      mutation UN($input: NoticeUpdate!) { updateNotice(input: $input) { _id noticeCategory noticeStatus noticePinned noticeTitle noticeViews publishedAt displayTitle displayContent displayLang } }
    variables: |-
      { "input": { "noticeId": "{{noticeAId}}", "noticeStatus": "ACTIVE" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const n = gql.updateNotice || {};
      pm.test('ACTIVE, publication dated', () => pm.expect([n.noticeStatus, !!n.publishedAt]).to.eql(['ACTIVE', true]));
      pm.environment.set('publishedA', n.publishedAt || '');
    language: text/javascript
order: 19000
