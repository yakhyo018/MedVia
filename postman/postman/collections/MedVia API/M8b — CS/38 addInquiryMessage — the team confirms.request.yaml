$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      mutation AM($input: InquiryMessageInput!) { addInquiryMessage(input: $input) { _id inquiryStatus inquiryLang inquiryReplyLang bookingId resolvedAt patientName bookingCode inquiryMessages { senderType text } } }
    variables: |-
      { "input": { "inquiryId": "{{inquiryId}}", "text": "Done — your visit is at 15:30.", "lang": "EN" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('ANSWERED', () => pm.expect((gql.addInquiryMessage || {}).inquiryStatus).to.eql('ANSWERED'));
    language: text/javascript
order: 38000
