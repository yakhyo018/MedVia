$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      query AI($input: AdminInquiriesInquiry!) { getInquiriesByAdmin(input: $input) { list { _id inquiryStatus } } }
    variables: |-
      { "input": { "page": 1, "limit": 100, "open": true } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('open', () => pm.expect(((gql.getInquiriesByAdmin || {}).list || []).map((i) => i._id)).to.include(pm.environment.get('inquiryId')));
    language: text/javascript
order: 34000
