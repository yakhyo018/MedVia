$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patient2Token}}
body:
  type: graphql
  content:
    query: |-
      mutation CI($input: InquiryInput!) { createInquiry(input: $input) { _id inquiryStatus inquiryLang inquiryReplyLang bookingId resolvedAt patientName bookingCode inquiryMessages { senderType text } } }
    variables: |-
      { "input": { "inquiryCategory": "ACCOUNT", "inquiryTitle": "Delete my medical data", "inquiryContent": "Please delete my questionnaire answers.", "inquiryLang": "UZ" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.environment.set('inquiry2Id', (gql.createInquiry || {})._id || '');
    language: text/javascript
order: 43000
