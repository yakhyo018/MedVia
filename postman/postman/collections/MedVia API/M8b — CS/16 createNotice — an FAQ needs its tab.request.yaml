$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      mutation CN($input: NoticeInput!) { createNotice(input: $input) { _id noticeCategory noticeStatus noticePinned noticeTitle noticeViews publishedAt displayTitle displayContent displayLang } }
    variables: |-
      { "input": { "noticeCategory": "FAQ", "noticeTitle": "How do I cancel? {{token}}", "noticeContent": "From My Bookings." } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test("refused: An FAQ needs its tab, and a notice has none!", () => pm.expect(msg).to.include("An FAQ needs its tab, and a notice has none!"));
      pm.test('code BAD_REQUEST', () => pm.expect(code).to.eql('BAD_REQUEST'));
    language: text/javascript
order: 16000
