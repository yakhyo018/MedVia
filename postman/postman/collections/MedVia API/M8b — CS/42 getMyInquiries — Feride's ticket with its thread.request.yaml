$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      query MI($input: OrdinaryInquiry!) { getMyInquiries(input: $input) { list { _id inquiryMessages { text } } metaCounter { total } } }
    variables: |-
      { "input": { "page": 1, "limit": 10 } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('one ticket, four messages', () => pm.expect([(((gql.getMyInquiries || {}).metaCounter || [])[0] || {}).total, ((((gql.getMyInquiries || {}).list || [])[0] || {}).inquiryMessages || []).length]).to.eql([1, 4]));
    language: text/javascript
order: 42000
