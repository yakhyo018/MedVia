$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      mutation CN($input: NoticeInput!) { createNotice(input: $input) { _id noticeCategory noticeStatus noticePinned noticeTitle noticeViews publishedAt displayTitle displayContent displayLang } }
    variables: |-
      { "input": { "noticeCategory": "NOTICE", "noticePinned": true, "noticeStatus": "ACTIVE", "noticeTitle": "Updated privacy policy {{token}}", "noticeContent": "How we protect health data." } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.environment.set('noticeBId', (gql.createNotice || {})._id || '');
    language: text/javascript
order: 20000
