$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      query N($input: NoticesInquiry!) { getNotices(input: $input) { list { _id noticeCategory noticeStatus noticePinned noticeTitle noticeViews publishedAt displayTitle displayContent displayLang } } }
    variables: |-
      { "input": { "page": 1, "limit": 50, "noticeCategory": "NOTICE", "lang": "RU" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const list = (gql.getNotices || {}).list || [];
      const ids = list.map((n) => n._id);
      const a = list.find((n) => n._id === pm.environment.get('noticeAId')) || {};
      const b = list.find((n) => n._id === pm.environment.get('noticeBId')) || {};
      pm.test('the pinned one comes first', () => pm.expect(ids.indexOf(pm.environment.get('noticeBId'))).to.be.below(ids.indexOf(pm.environment.get('noticeAId'))));
      pm.test('the translated one in Russian', () => pm.expect([a.displayLang, (a.displayTitle || '').startsWith('Часы работы')]).to.eql(['RU', true]));
      pm.test('the untranslated one in English', () => pm.expect(b.displayLang).to.eql('EN'));
    language: text/javascript
order: 21000
