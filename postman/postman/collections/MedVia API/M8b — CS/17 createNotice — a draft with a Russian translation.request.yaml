$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      mutation CN($input: NoticeInput!) { createNotice(input: $input) { _id noticeCategory noticeStatus noticePinned noticeTitle noticeViews publishedAt displayTitle displayContent displayLang } }
    variables: |-
      { "input": { "noticeCategory": "NOTICE", "noticeTitle": "Chuseok holiday hours {{token}}", "noticeContent": "Partner clinics close 25-28 Sep.", "noticeTranslations": [ { "lang": "RU", "title": "Часы работы на Чхусок {{token}}", "content": "Клиники закрыты 25-28 сентября." } ] } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const n = gql.createNotice || {};
      pm.test('HOLD, not published yet', () => pm.expect([n.noticeStatus, n.publishedAt]).to.eql(['HOLD', null]));
      pm.environment.set('noticeAId', n._id || '');
    language: text/javascript
order: 17000
