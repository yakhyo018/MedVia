$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation RI($id: String!) { resolveInquiry(inquiryId: $id) { _id inquiryStatus inquiryLang inquiryReplyLang bookingId resolvedAt patientName bookingCode inquiryMessages { senderType text } } }
    variables: |-
      { "id": "{{inquiryId}}" }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const i = gql.resolveInquiry || {};
      pm.test('RESOLVED with a time', () => pm.expect([i.inquiryStatus, !!i.resolvedAt]).to.eql(['RESOLVED', true]));
    language: text/javascript
order: 39000
