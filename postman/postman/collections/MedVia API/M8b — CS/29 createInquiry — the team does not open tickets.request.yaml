$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      mutation CI($input: InquiryInput!) { createInquiry(input: $input) { _id inquiryStatus inquiryLang inquiryReplyLang bookingId resolvedAt patientName bookingCode inquiryMessages { senderType text } } }
    variables: |-
      { "input": { "inquiryCategory": "BOOKING", "inquiryTitle": "Test", "inquiryContent": "Hello there", "inquiryLang": "EN" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test("refused: Allowed only for members with specific roles!", () => pm.expect(msg).to.include("Allowed only for members with specific roles!"));
      pm.test('code FORBIDDEN', () => pm.expect(code).to.eql('FORBIDDEN'));
    language: text/javascript
order: 29000
