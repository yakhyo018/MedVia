$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patient2Token}}
body:
  type: graphql
  content:
    query: |-
      mutation CR($input: ReviewCreateInput!) { createReview(input: $input) { _id reviewStatus reviewRating reviewTags reviewFlags reviewContent reviewLang reviewNote submittedAt bookingId patientName clinicName doctorName treatmentName visitDate reviewReply { replyContent replyLang replierType repliedAt } } }
    variables: |-
      { "input": { "bookingId": "{{bookingBId}}", "reviewRating": 3, "reviewTags": ["EXPLANATION", "PRICE_MATCHED"], "reviewContent": "Good care, but I waited forty minutes past my time.", "reviewLang": "EN", "ownVisitConfirmed": true } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.environment.set('reviewBId', (gql.createReview || {})._id || '');
    language: text/javascript
order: 54000
