$kind: collection
description: Verified reviews. A review needs the patient's own COMPLETED visit (the suite moves visits into the past with devShiftBookingTime — needs ENABLE_TEST_SUPPORT=true); one review per visit, also after it is deleted; admin moderation (request edit with a message and flags, approve, hide after a complaint) recorded in the audit log; a patient's edit goes back to the queue; one public reply by the clinic or the doctor of the visit; clinicRating / doctorRating recomputed from published reviews; public lists show "Feride K." and never the admin's note; "Needs reply" narrows the list, not the summary. The 30-day window is covered by Jest in review.rules.spec.ts. Self-contained. Needs ADMIN_EMAIL / ADMIN_PASSWORD, MEDICAL_ENC_KEY and ENABLE_TEST_SUPPORT=true in .env.
order: 7000
