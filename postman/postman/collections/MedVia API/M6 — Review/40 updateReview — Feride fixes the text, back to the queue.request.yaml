$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation UR($input: ReviewUpdate!) { updateReview(input: $input) { _id reviewStatus reviewRating reviewTags reviewFlags reviewContent reviewLang reviewNote submittedAt bookingId patientName clinicName doctorName treatmentName visitDate reviewReply { replyContent replyLang replierType repliedAt } } }
    variables: |-
      { "input": { "reviewId": "{{reviewAId}}", "reviewContent": "The interpreter explained every step and the price matched the page." } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const r = gql.updateReview || {};
      pm.test('PENDING, note and flags cleared', () => pm.expect([r.reviewStatus, r.reviewNote, r.reviewFlags]).to.eql(['PENDING', null, []]));
    language: text/javascript
order: 40000
