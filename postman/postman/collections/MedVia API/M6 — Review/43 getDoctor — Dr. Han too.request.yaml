$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      query D($id: String!) { getDoctor(doctorId: $id) { _id doctorRating doctorReviews } }
    variables: |-
      { "id": "{{doctorAId}}" }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const d = gql.getDoctor || {};
      pm.test('doctorRating 5, doctorReviews 1', () => pm.expect([d.doctorRating, d.doctorReviews]).to.eql([5, 1]));
    language: text/javascript
order: 43000
