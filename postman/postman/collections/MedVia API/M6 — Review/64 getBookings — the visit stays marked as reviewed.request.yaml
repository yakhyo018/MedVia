$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      query L($input: BookingsInquiry!) { getBookings(input: $input) { list { _id bookingReviewed } } }
    variables: |-
      { "input": { "page": 1, "limit": 10, "tab": "PAST" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('bookingReviewed', () => pm.expect((((gql.getBookings || {}).list || [])[0] || {}).bookingReviewed).to.eql(true));
    language: text/javascript
order: 64000
