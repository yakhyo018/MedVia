$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation CR($input: ReviewCreateInput!) { createReview(input: $input) { _id reviewStatus reviewRating reviewTags reviewFlags reviewContent reviewLang reviewNote submittedAt bookingId patientName clinicName doctorName treatmentName visitDate reviewReply { replyContent replyLang replierType repliedAt } } }
    variables: |-
      { "input": { "bookingId": "{{bookingAId}}", "reviewRating": 5, "reviewTags": ["EXPLANATION", "PRICE_MATCHED"], "reviewContent": "Results guaranteed, the best clinic in Seoul!", "reviewLang": "EN", "ownVisitConfirmed": true } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const r = gql.createReview || {};
      pm.test('PENDING, 5 stars', () => pm.expect([r.reviewStatus, r.reviewRating]).to.eql(['PENDING', 5]));
      pm.environment.set('reviewAId', r._id || '');
    language: text/javascript
order: 30000
