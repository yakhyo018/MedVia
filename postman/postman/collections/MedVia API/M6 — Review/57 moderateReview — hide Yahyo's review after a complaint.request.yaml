$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      mutation M($input: ReviewModerationInput!) { moderateReview(input: $input) { _id reviewStatus reviewRating reviewTags reviewFlags reviewContent reviewLang reviewNote submittedAt bookingId patientName clinicName doctorName treatmentName visitDate reviewReply { replyContent replyLang replierType repliedAt } } }
    variables: |-
      { "input": { "reviewId": "{{reviewBId}}", "decision": "REJECT", "reviewNote": "Hidden after a complaint about personal data.", "reviewFlags": ["PERSONAL_DATA"] } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('HIDDEN', () => pm.expect((gql.moderateReview || {}).reviewStatus).to.eql('HIDDEN'));
    language: text/javascript
order: 57000
