$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation CR($input: ReviewCreateInput!) { createReview(input: $input) { _id reviewStatus reviewRating reviewTags reviewFlags reviewContent reviewLang reviewNote submittedAt bookingId patientName clinicName doctorName treatmentName visitDate reviewReply { replyContent replyLang replierType repliedAt } } }
    variables: |-
      { "input": { "bookingId": "{{bookingAId}}", "reviewRating": 5, "reviewTags": ["EXPLANATION", "PRICE_MATCHED"], "reviewContent": "Results guaranteed, the best clinic in Seoul!", "reviewLang": "EN", "ownVisitConfirmed": true } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test("refused: Only a completed visit can be reviewed!", () => pm.expect(msg).to.include("Only a completed visit can be reviewed!"));
      pm.test('code BAD_REQUEST', () => pm.expect(code).to.eql('BAD_REQUEST'));
    language: text/javascript
order: 24000
