$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      query L($input: ReviewsInquiry!) { getReviews(input: $input) { list { _id reviewStatus reviewRating reviewTags reviewFlags reviewContent reviewLang reviewNote submittedAt bookingId patientName clinicName doctorName treatmentName visitDate reviewReply { replyContent replyLang replierType repliedAt } } metaCounter { total } summary { rating reviews distribution { stars count } } } }
    variables: |-
      { "input": { "page": 1, "limit": 10, "clinicId": "{{clinicId}}" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const l = gql.getReviews || {};
      const r = (l.list || [])[0] || {};
      pm.test('one review by Feride K.', () => pm.expect([(l.list || []).length, r.patientName]).to.eql([1, 'Feride K.']));
      pm.test('no admin note or flags in public', () => pm.expect([r.reviewNote, r.reviewFlags]).to.eql([null, null]));
      pm.test('summary 5.0 from 1', () => pm.expect([(l.summary || {}).rating, (l.summary || {}).reviews]).to.eql([5, 1]));
      pm.test('the 5-star bar', () => pm.expect(((l.summary || {}).distribution || [])[0]).to.eql({ stars: 5, count: 1 }));
    language: text/javascript
order: 44000
