$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      query GetMyClinic {
        getMyClinic {
          _id clinicStatus clinicName clinicNameKo clinicSpecialty clinicDistrict clinicAddress
          clinicLangs clinicImages clinicReviewNote clinicLikes clinicFollowers clinicViews
          memberId submittedAt verifiedAt
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const c = gql.getMyClinic || {};
      pm.test('status PENDING', () => pm.expect(c.clinicStatus).to.eql('PENDING'));
      pm.test('linked to the clinic account', () => pm.expect(c.memberId).to.eql(pm.environment.get('clinicMemberId')));
      pm.test('Korean signboard name stored', () => pm.expect(c.clinicNameKo).to.eql('포스트맨글로우피부과의원'));
      pm.test('submittedAt set for the admin queue', () => pm.expect(Date.parse(c.submittedAt)).to.not.be.NaN);
      pm.test('not verified yet', () => pm.expect(c.verifiedAt).to.be.null);
      pm.test('counters start at zero', () => pm.expect([c.clinicLikes, c.clinicFollowers, c.clinicViews]).to.eql([0, 0, 0]));
      pm.environment.set('clinicId', c._id || '');
    language: text/javascript
order: 6000
