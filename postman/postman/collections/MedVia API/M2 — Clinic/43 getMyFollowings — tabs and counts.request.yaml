$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      query GetMyFollowings($input: FollowingsInquiry!) {
        getMyFollowings(input: $input) {
          list { followingType followingClinic { _id clinicName } followingMember { memberDisplayName } }
          metaCounter { total }
          typeCounts { followingType total }
        }
      }
    variables: |-
      { "input": { "page": 1, "limit": 10, "followingType": "AGENT" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const page = gql.getMyFollowings || {};
      pm.test('Clinics tab: one', () => pm.expect(page.metaCounter).to.eql([{ total: 1 }]));
      pm.test('the clinic card', () => pm.expect((((page.list || [])[0] || {}).followingClinic || {})._id).to.eql(pm.environment.get('clinicId')));
      pm.test('tab badges in the same answer', () => pm.expect(page.typeCounts).to.eql([{ followingType: 'AGENT', total: 1 }]));
    language: text/javascript
order: 43000
