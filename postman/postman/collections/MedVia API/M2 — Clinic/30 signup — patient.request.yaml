$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation Signup($input: MemberInput!) {
        signup(input: $input) { _id memberType accessToken }
      }
    variables: |-
      {
        "input": {
          "memberType": "USER",
          "memberEmail": "{{patientEmail}}",
          "memberPassword": "Patient#2026",
          "memberFullName": "Feride Karimova",
          "memberLang": "RU",
          "termsAccepted": true
        }
      }
scripts:
  - type: beforeRequest
    code: |-
      pm.environment.set('patientEmail', 'patient.' + Date.now() + '@medvia.test');
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const m = gql.signup || {};
      pm.environment.set('patientToken', m.accessToken || '');
      pm.environment.set('patientId', m._id || '');
    language: text/javascript
order: 30000
