$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation SignupClinic($input: ClinicSignupInput!) {
        signupClinic(input: $input) { _id memberType memberEmail memberFullName memberLang accessToken }
      }
    variables: |-
      {
        "input": {
          "memberEmail": "{{clinicEmail}}",
          "memberPassword": "Clinic#2026",
          "memberFullName": "Kim Ji-won",
          "clinicName": "{{clinicName}}",
          "clinicNameKo": "포스트맨글로우피부과의원",
          "clinicSpecialty": "DERMATOLOGY",
          "clinicDistrict": "GANGNAM",
          "clinicAddress": "12 Teheran-ro, Gangnam-gu, Seoul",
          "clinicPhone": "+82 2 555 0101",
          "termsAccepted": true,
          "authorizedConfirmed": true
        }
      }
scripts:
  - type: beforeRequest
    code: |-
      const stamp = Date.now();
      pm.environment.set('clinicEmail', 'clinic.' + stamp + '@medvia.test');
      pm.environment.set('clinicName', 'Postman Glow ' + stamp);
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const m = gql.signupClinic || {};
      pm.test('role AGENT', () => pm.expect(m.memberType).to.eql('AGENT'));
      pm.test('manager name stored on the account', () => pm.expect(m.memberFullName).to.eql('Kim Ji-won'));
      pm.test('clinic account works in Korean by default', () => pm.expect(m.memberLang).to.eql('KO'));
      pm.test('access token returned', () => pm.expect(String(m.accessToken).split('.')).to.have.length(3));
      pm.test('refresh token set as a cookie', () => pm.expect(pm.cookies.has('medvia_rt')).to.be.true);
      pm.environment.set('clinicToken', m.accessToken || '');
      pm.environment.set('clinicMemberId', m._id || '');
    language: text/javascript
order: 1000
