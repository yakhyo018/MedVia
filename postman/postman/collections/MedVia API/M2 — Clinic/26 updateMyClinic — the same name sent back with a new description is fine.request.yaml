$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation UpdateMyClinic($input: ClinicUpdate!) {
        updateMyClinic(input: $input) {
          _id clinicStatus clinicName clinicImages clinicLogo clinicLangs clinicInterpreterLangs clinicDesc
          clinicHours { day open close closed }
          clinicLocation { type coordinates }
        }
      }
    variables: |-
      {
        "input": {
          "clinicName": "{{clinicName}}",
          "clinicDesc": "Consultations for international patients are held with an interpreter."
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const c = gql.updateMyClinic || {};
      pm.test('name unchanged', () => pm.expect(c.clinicName).to.eql(pm.environment.get('clinicName')));
      pm.test('description updated', () => pm.expect(c.clinicDesc).to.include('interpreter'));
    language: text/javascript
order: 26000
