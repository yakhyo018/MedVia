$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation FollowMember($input: FollowInput!) {
        followMember(input: $input) {
          _id followingType followingId
          followingMember { memberType memberDisplayName }
          followingClinic { _id clinicFollowers }
        }
      }
    variables: |-
      { "input": { "memberId": "{{patientId}}" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const f = gql.followMember || {};
      pm.test('followingType USER', () => pm.expect(f.followingType).to.eql('USER'));
      pm.test('a patient shows as first name + initial', () => pm.expect((f.followingMember || {}).memberDisplayName).to.eql('Feride K.'));
      pm.test('no clinic card for a patient', () => pm.expect(f.followingClinic).to.be.null);
    language: text/javascript
order: 42000
