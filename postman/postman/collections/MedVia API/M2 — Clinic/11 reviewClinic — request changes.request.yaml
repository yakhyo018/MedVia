$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      mutation ReviewClinic($input: ClinicReviewInput!) {
        reviewClinic(input: $input) { _id clinicStatus clinicReviewNote verifiedAt }
      }
    variables: |-
      {
        "input": {
          "clinicId": "{{clinicId}}",
          "decision": "REQUEST_CHANGES",
          "clinicReviewNote": "Please add photos of the reception and the languages you speak."
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const c = gql.reviewClinic || {};
      pm.test('status CHANGES_REQUESTED', () => pm.expect(c.clinicStatus).to.eql('CHANGES_REQUESTED'));
      pm.test('message stored for the clinic', () => pm.expect(c.clinicReviewNote).to.include('photos of the reception'));
    language: text/javascript
order: 11000
