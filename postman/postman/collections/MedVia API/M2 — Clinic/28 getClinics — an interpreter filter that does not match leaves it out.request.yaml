$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      query GetClinics($input: ClinicsInquiry!) {
        getClinics(input: $input) {
          list { _id clinicName clinicDistrict clinicLangs clinicInterpreterLangs clinicLikes }
          metaCounter { total }
        }
      }
    variables: |-
      {
        "input": {
          "page": 1,
          "limit": 10,
          "search": { "text": "{{clinicName}}", "langs": ["KK"], "interpreter": true }
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const page = gql.getClinics || {};
      // Not "empty": other clinics (the demo seed) may share a word of the name and have a Kazakh interpreter.
      pm.test('this clinic is filtered out', () => pm.expect((page.list || []).map((c) => c._id)).to.not.include(pm.environment.get('clinicId')));
    language: text/javascript
order: 28000
