$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      query GetMyClinic {
        getMyClinic {
          _id clinicStatus clinicName clinicNameKo clinicSpecialty clinicDistrict clinicAddress
          clinicLangs clinicImages clinicReviewNote clinicLikes clinicFollowers clinicViews
          memberId submittedAt verifiedAt
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('clinicViews is 1', () => pm.expect((gql.getMyClinic || {}).clinicViews).to.eql(1));
    language: text/javascript
order: 33000
