$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      query GetClinics($input: ClinicsInquiry!) {
        getClinics(input: $input) { list { _id clinicLikes meLiked meFollowed } }
      }
    variables: |-
      { "input": { "page": 1, "limit": 10, "search": { "specialty": "DERMATOLOGY", "districts": ["GANGNAM"] } } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const c = ((gql.getClinics || {}).list || []).find((x) => x._id === pm.environment.get('clinicId')) || {};
      pm.test('the card is in the list', () => pm.expect(c._id).to.eql(pm.environment.get('clinicId')));
      pm.test('meLiked true, meFollowed false', () => pm.expect([c.meLiked, c.meFollowed]).to.eql([true, false]));
    language: text/javascript
order: 35300
