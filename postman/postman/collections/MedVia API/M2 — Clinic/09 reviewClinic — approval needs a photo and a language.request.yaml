$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      mutation ReviewClinic($input: ClinicReviewInput!) {
        reviewClinic(input: $input) { _id clinicStatus clinicReviewNote verifiedAt }
      }
    variables: |-
      {
        "input": {
          "clinicId": "{{clinicId}}",
          "decision": "APPROVE"
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('refused: Add at least one photo and one reception language before approval!', () => pm.expect(msg).to.include("Add at least one photo and one reception language before approval!"));
      pm.test('code BAD_REQUEST', () => pm.expect(code).to.eql('BAD_REQUEST'));
    language: text/javascript
order: 9000
