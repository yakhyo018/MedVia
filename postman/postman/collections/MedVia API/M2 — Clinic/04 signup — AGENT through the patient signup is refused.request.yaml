$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation Signup($input: MemberInput!) {
        signup(input: $input) { _id memberType }
      }
    variables: |-
      {
        "input": {
          "memberType": "AGENT",
          "memberEmail": "agent.{{clinicEmail}}",
          "memberPassword": "Clinic#2026",
          "memberFullName": "Kim Ji-won",
          "memberLang": "KO",
          "termsAccepted": true
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('refused: clinics sign up with signupClinic', () => pm.expect(msg).to.include("clinics sign up with signupClinic"));
    language: text/javascript
order: 4000
