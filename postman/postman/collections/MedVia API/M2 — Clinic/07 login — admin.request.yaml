$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation Login($input: LoginInput!) {
        login(input: $input) { _id memberType accessToken }
      }
    variables: |-
      {
        "input": {
          "memberEmail": "{{adminEmail}}",
          "memberPassword": "{{adminPassword}}"
        }
      }
scripts:
  - type: beforeRequest
    code: |-
      const adminClaims = (() => {
        const part = (pm.environment.get('adminToken') || '').split('.')[1] || '';
        try {
          const b64 = part.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((part.length + 3) % 4);
          return JSON.parse(atob(b64));
        } catch (e) {
          return null;
        }
      })();
      if (adminClaims && adminClaims.memberType === 'ADMIN' && adminClaims.exp * 1000 - Date.now() > 5 * 60000) {
        pm.environment.set('adminId', adminClaims.sub);
        pm.execution.skipRequest();
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('adminEmail / adminPassword are configured', () =>
        pm.expect(pm.environment.get('adminEmail'), 'add ADMIN_EMAIL and ADMIN_PASSWORD to .env, then npm run seed:admin').to.be.a('string').and.not.empty);
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const m = gql.login || {};
      pm.test('role ADMIN', () => pm.expect(m.memberType).to.eql('ADMIN'));
      pm.environment.set('adminToken', m.accessToken || '');
      pm.environment.set('adminId', m._id || '');
    language: text/javascript
order: 7000
