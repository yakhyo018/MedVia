$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation FollowMember($input: FollowInput!) {
        followMember(input: $input) {
          _id followingType followingId
          followingMember { memberType memberDisplayName }
          followingClinic { _id clinicFollowers }
        }
      }
    variables: |-
      { "input": { "memberId": "{{clinicMemberId}}" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const f = gql.followMember || {};
      pm.test('followingType AGENT', () => pm.expect(f.followingType).to.eql('AGENT'));
      pm.test('clinic card attached', () => pm.expect((f.followingClinic || {})._id).to.eql(pm.environment.get('clinicId')));
      pm.test('clinicFollowers 1', () => pm.expect((f.followingClinic || {}).clinicFollowers).to.eql(1));
      pm.test('public fields only', () => pm.expect(f.followingMember).to.eql({ memberType: 'AGENT', memberDisplayName: 'Kim Ji-won' }));
    language: text/javascript
order: 38000
