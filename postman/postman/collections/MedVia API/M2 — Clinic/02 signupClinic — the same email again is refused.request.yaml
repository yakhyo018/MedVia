$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation SignupClinic($input: ClinicSignupInput!) {
        signupClinic(input: $input) { _id memberType memberEmail memberFullName memberLang accessToken }
      }
    variables: |-
      {
        "input": {
          "memberEmail": "{{clinicEmail}}",
          "memberPassword": "Clinic#2026",
          "memberFullName": "Kim Ji-won",
          "clinicName": "{{clinicName}}",
          "clinicNameKo": "포스트맨글로우피부과의원",
          "clinicSpecialty": "DERMATOLOGY",
          "clinicDistrict": "GANGNAM",
          "clinicAddress": "12 Teheran-ro, Gangnam-gu, Seoul",
          "clinicPhone": "+82 2 555 0101",
          "termsAccepted": true,
          "authorizedConfirmed": true
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('refused: This email address is already registered!', () => pm.expect(msg).to.include("This email address is already registered!"));
      pm.test('code BAD_REQUEST', () => pm.expect(code).to.eql('BAD_REQUEST'));
      pm.test('no second account', () => pm.expect(gql.signupClinic).to.not.be.ok);
    language: text/javascript
order: 2000
