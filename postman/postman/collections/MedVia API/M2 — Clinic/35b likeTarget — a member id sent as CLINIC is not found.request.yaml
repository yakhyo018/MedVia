$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation LikeTarget($input: LikeTargetInput!) {
        likeTarget(input: $input) { likeGroup likeRefId meLiked likes }
      }
    variables: |-
      { "input": { "likeGroup": "CLINIC", "likeRefId": "{{patientId}}" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      // The group decides where the id is looked up: a member id is no clinic.
      pm.test('refused: No data is found!', () => pm.expect(msg).to.include("No data is found!"));
    language: text/javascript
order: 35200
