$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation LikeTargetClinic($clinicId: String!) {
        likeTargetClinic(clinicId: $clinicId) { _id clinicLikes meLiked }
      }
    variables: |-
      { "clinicId": "{{clinicId}}" }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const c = gql.likeTargetClinic || {};
      pm.test('clinicLikes 1', () => pm.expect(c.clinicLikes).to.eql(1));
      pm.test('meLiked true', () => pm.expect(c.meLiked).to.eql(true));
    language: text/javascript
order: 35000
