$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      query GetRecentlyVisited($input: OrdinaryInquiry!) {
        getRecentlyVisited(input: $input) {
          list { viewGroup viewRefId visitedAt clinic { _id clinicName } }
          metaCounter { total }
        }
      }
    variables: |-
      { "input": { "page": 1, "limit": 10 } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const page = gql.getRecentlyVisited || {};
      const v = (page.list || [])[0] || {};
      pm.test('one entry, despite two visits', () => pm.expect(page.metaCounter).to.eql([{ total: 1 }]));
      pm.test('a CLINIC entry', () => pm.expect(v.viewGroup).to.eql('CLINIC'));
      pm.test('it is this clinic', () => pm.expect((v.clinic || {})._id).to.eql(pm.environment.get('clinicId')));
    language: text/javascript
order: 37000
