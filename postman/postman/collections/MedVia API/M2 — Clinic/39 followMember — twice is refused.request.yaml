$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation FollowMember($input: FollowInput!) {
        followMember(input: $input) {
          _id followingType followingId
          followingMember { memberType memberDisplayName }
          followingClinic { _id clinicFollowers }
        }
      }
    variables: |-
      { "input": { "memberId": "{{clinicMemberId}}" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('refused: You already follow this member!', () => pm.expect(msg).to.include("You already follow this member!"));
      pm.test('code BAD_REQUEST', () => pm.expect(code).to.eql('BAD_REQUEST'));
    language: text/javascript
order: 39000
