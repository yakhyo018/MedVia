$kind: collection
description: Slots and bookings. The clinic opens 30-minute slots inside its opening hours and blocks time; a 60-minute treatment holds two consecutive slots for 10 minutes (one form per patient, a second patient cannot overlap); the request copies the price, stamps consent versions and stores the questionnaire encrypted (the patient, the clinic and the doctor read it, the admin does not); every role reads bookings through one scoped query (no IDOR); confirm, decline, cancel and the refusals of the status machine; slots free again after a cancel or decline; an admin cancel is audited; a doctor with an upcoming visit cannot be removed. Time rules that need a clock (expiry, the 24-hour cancel limit, COMPLETED after the visit) are covered by Jest in booking.rules.spec.ts. Self-contained. Needs ADMIN_EMAIL / ADMIN_PASSWORD and MEDICAL_ENC_KEY in .env.
order: 6000
