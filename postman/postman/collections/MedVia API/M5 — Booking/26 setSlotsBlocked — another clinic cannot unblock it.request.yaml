$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{otherClinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation B($input: SlotsBlockInput!) { setSlotsBlocked(input: $input) { _id slotStatus slotStart slotBlockReason doctorId bookingId bookingData { bookingCode bookingStatus patientName treatmentName } } }
    variables: |-
      { "input": { "slotIds": ["{{slot1130Id}}"], "blocked": false } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test("refused: This time is no longer available", () => pm.expect(msg).to.include("This time is no longer available"));
      pm.test('code BAD_REQUEST', () => pm.expect(code).to.eql('BAD_REQUEST'));
    language: text/javascript
order: 26000
