$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      query L($input: BookingsInquiry!) { getBookings(input: $input) { list { _id bookingCode bookingStatus bookingDate bookingPrice bookingLang bookingInterpreter bookingDeclineReason cancelledBy respondDeadline slotIds patientName bookingHistory { status reason } bookingConsents { consentType agreed version } bookingQuestionnaire { originalLang answers { question answer } } clinicData { clinicName } doctorData { doctorName } treatmentData { treatmentName } } metaCounter { total } } }
    variables: |-
      { "input": { "page": 1, "limit": 10, "bookingStatus": "PENDING" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const l = gql.getBookings || {};
      const first = (l.list || [])[0] || {};
      pm.test('one PENDING request', () => pm.expect([((l.metaCounter || [])[0] || {}).total, first._id]).to.eql([1, pm.environment.get('bookingId')]));
      pm.test('lists never decrypt', () => pm.expect(first.bookingQuestionnaire).to.eql(null));
    language: text/javascript
order: 46000
