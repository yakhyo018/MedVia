$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      query S($input: ClinicScheduleInquiry!) { getClinicSchedule(input: $input) { _id slotStatus slotStart slotBlockReason doctorId bookingId bookingData { bookingCode bookingStatus patientName treatmentName } } }
    variables: |-
      { "input": { "dateFrom": "{{slotDate}}" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const slots = gql.getClinicSchedule || [];
      const at = (t) => (slots.find((x) => x.slotStart === pm.environment.get(t)) || {}).slotStatus;
      pm.test('10:00 and 10:30 BOOKED, 11:00 OPEN', () => pm.expect([at('t1000'), at('t1030'), at('t1100')]).to.eql(['BOOKED', 'BOOKED', 'OPEN']));
    language: text/javascript
order: 53000
