$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      query G($id: String!) { getBooking(bookingId: $id) { _id bookingCode bookingStatus bookingDate bookingPrice bookingLang bookingInterpreter bookingDeclineReason cancelledBy respondDeadline slotIds patientName bookingHistory { status reason } bookingConsents { consentType agreed version } bookingQuestionnaire { originalLang answers { question answer } } clinicData { clinicName } doctorData { doctorName } treatmentData { treatmentName } } }
    variables: |-
      { "id": "{{bookingId}}" }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const b = gql.getBooking || {};
      const answers = ((b.bookingQuestionnaire || {}).answers || []).map((a) => a.answer);
      pm.test('answers decrypted', () => pm.expect(answers).to.eql(['Пигментация на щеках', 'Аллергия на пенициллин']));
      pm.test('cards attached', () => pm.expect([(b.doctorData || {}).doctorName, (b.treatmentData || {}).treatmentName]).to.eql(['Han Seo-yeon', pm.environment.get('bTreatmentName')]));
    language: text/javascript
order: 40000
