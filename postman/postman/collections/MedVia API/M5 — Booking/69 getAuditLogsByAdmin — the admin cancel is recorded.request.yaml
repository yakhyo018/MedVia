$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      query Q($input: AuditLogsInquiry!) { getAuditLogsByAdmin(input: $input) { auditAction auditNote } }
    variables: |-
      { "input": { "auditGroup": "BOOKING", "auditRefId": "{{bookingCId}}" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('one BOOKING_CANCEL', () => pm.expect((gql.getAuditLogsByAdmin || []).map((a) => a.auditAction)).to.eql(['BOOKING_CANCEL']));
    language: text/javascript
order: 69000
