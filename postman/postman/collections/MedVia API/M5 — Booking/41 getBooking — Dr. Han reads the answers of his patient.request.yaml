$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{doctorToken}}
body:
  type: graphql
  content:
    query: |-
      query G($id: String!) { getBooking(bookingId: $id) { _id bookingCode bookingStatus bookingDate bookingPrice bookingLang bookingInterpreter bookingDeclineReason cancelledBy respondDeadline slotIds patientName bookingHistory { status reason } bookingConsents { consentType agreed version } bookingQuestionnaire { originalLang answers { question answer } } clinicData { clinicName } doctorData { doctorName } treatmentData { treatmentName } } }
    variables: |-
      { "id": "{{bookingId}}" }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const b = gql.getBooking || {};
      pm.test('answers present', () => pm.expect(((b.bookingQuestionnaire || {}).answers || []).length).to.eql(2));
      pm.test('patient name for the clinic', () => pm.expect(b.patientName).to.eql('Feride Karimova'));
    language: text/javascript
order: 41000
