$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{otherClinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation C($input: SlotsCreateInput!) { createSlots(input: $input) { created planned } }
    variables: |-
      { "input": { "doctorId": "{{doctorAId}}", "dateFrom": "{{slotDate}}", "dateTo": "{{slotDate}}", "timeFrom": "10:00", "timeTo": "12:00" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test("refused: No data is found!", () => pm.expect(msg).to.include("No data is found!"));
      pm.test('code NOT_FOUND', () => pm.expect(code).to.eql('NOT_FOUND'));
    language: text/javascript
order: 20000
