$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation U($input: BookingStatusUpdate!) { updateBookingStatus(input: $input) { _id bookingCode bookingStatus bookingDate bookingPrice bookingLang bookingInterpreter bookingDeclineReason cancelledBy respondDeadline slotIds patientName bookingHistory { status reason } bookingConsents { consentType agreed version } bookingQuestionnaire { originalLang answers { question answer } } clinicData { clinicName } doctorData { doctorName } treatmentData { treatmentName } } }
    variables: |-
      { "input": { "bookingId": "{{bookingId}}", "bookingStatus": "COMPLETED" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test("refused: This can be set only after the visit time has started!", () => pm.expect(msg).to.include("This can be set only after the visit time has started!"));
      pm.test('code BAD_REQUEST', () => pm.expect(code).to.eql('BAD_REQUEST'));
    language: text/javascript
order: 55000
