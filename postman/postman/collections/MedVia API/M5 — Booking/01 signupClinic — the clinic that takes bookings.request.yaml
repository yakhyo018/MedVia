$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation SignupClinic($input: ClinicSignupInput!) { signupClinic(input: $input) { _id accessToken } }
    variables: |-
      {
        "input": {
          "memberEmail": "bclinic.{{stamp}}@medvia.test", "memberPassword": "Clinic#2026", "memberFullName": "Kim Ji-won",
          "clinicName": "Booking Test Clinic {{stamp}}", "clinicSpecialty": "DERMATOLOGY", "clinicDistrict": "GANGNAM",
          "clinicAddress": "12 Teheran-ro, Gangnam-gu, Seoul", "termsAccepted": true, "authorizedConfirmed": true
        }
      }
scripts:
  - type: beforeRequest
    code: |-
      const stamp = Date.now();
      pm.environment.set('stamp', String(stamp));
      pm.environment.set('bTreatmentName', 'Skin Booster bk' + stamp.toString(36));
      // Slots three days ahead, in Seoul time (UTC+9, no daylight saving).
      const DAY = 86400000;
      const seoulDate = (ms) => new Date(ms + 9 * 3600000).toISOString().slice(0, 10);
      const slotDate = seoulDate(stamp + 3 * DAY);
      pm.environment.set('slotDate', slotDate);
      pm.environment.set('pastDate', seoulDate(stamp - DAY));
      pm.environment.set('sameMonth', String(seoulDate(stamp).slice(0, 7) === slotDate.slice(0, 7)));
      for (const t of ['09:00', '10:00', '10:30', '11:00', '11:30'])
        pm.environment.set('t' + t.replace(':', ''), new Date(slotDate + 'T' + t + ':00+09:00').toISOString());
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.environment.set('clinicToken', (gql.signupClinic || {}).accessToken || '');
    language: text/javascript
order: 1000
