$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation U($input: BookingStatusUpdate!) { updateBookingStatus(input: $input) { _id bookingCode bookingStatus bookingDate bookingPrice bookingLang bookingInterpreter bookingDeclineReason cancelledBy respondDeadline slotIds patientName bookingHistory { status reason } bookingConsents { consentType agreed version } bookingQuestionnaire { originalLang answers { question answer } } clinicData { clinicName } doctorData { doctorName } treatmentData { treatmentName } } }
    variables: |-
      { "input": { "bookingId": "{{bookingId}}", "bookingStatus": "CONFIRMED" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const b = gql.updateBookingStatus || {};
      pm.test('CONFIRMED', () => pm.expect(b.bookingStatus).to.eql('CONFIRMED'));
      pm.test('history PENDING → CONFIRMED', () => pm.expect((b.bookingHistory || []).map((h) => h.status)).to.eql(['PENDING', 'CONFIRMED']));
    language: text/javascript
order: 52000
