$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation C($input: SlotsCreateInput!) { createSlots(input: $input) { created planned } }
    variables: |-
      { "input": { "doctorId": "{{doctorAId}}", "dateFrom": "{{slotDate}}", "dateTo": "{{slotDate}}", "timeFrom": "10:15", "timeTo": "12:00" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test("refused: timeFrom must be HH:00 or HH:30", () => pm.expect(msg).to.include("timeFrom must be HH:00 or HH:30"));
      pm.test('code BAD_REQUEST', () => pm.expect(code).to.eql('BAD_REQUEST'));
    language: text/javascript
order: 17000
