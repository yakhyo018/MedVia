$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      query A($input: AvailableSlotsInquiry!) { getAvailableSlots(input: $input) }
    variables: |-
      { "input": { "treatmentId": "{{treatmentId}}", "doctorId": "{{doctorAId}}", "date": "{{slotDate}}" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const starts = gql.getAvailableSlots || [];
      const expected = [pm.environment.get('t1000'), pm.environment.get('t1030'), pm.environment.get('t1100')];
      pm.test("free starts: t1000, t1030, t1100", () => pm.expect(starts).to.eql(expected));
    language: text/javascript
order: 59000
