$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{naviToken}}
body:
  type: graphql
  content:
    query: |-
      query AskNavi($input: AskNaviInput!) {
        askNavi(input: $input) {
          answer
          refused
          sources {
            index
            docId
            title
            heading
            cited
            url
          }
          disclaimer
        }
      }
    variables: |-
      {
        "input": {
          "question": "Какой адрес у Itaewon Compass Dental?"
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json(); } catch (e) { return {}; } })();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const a = gql.askNavi || {};
      const sources = a.sources || [];
      console.log('ANSWER:', a.answer);

      if (msg.includes('not available')) {
        pm.test.skip('Navi is not running — start navi-api and set NAVI_URL / NAVI_API_KEY', () => {});
      } else {
        pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
        pm.test('answered, not refused', () => pm.expect(a.refused, a.answer).to.eql(false));
        pm.test('the answer is in Russian', () => pm.expect(a.answer || '').to.match(/[а-яё]/i));
        pm.test('a cited source links to the clinic page', () => {
          const cited = sources.find((s) => s.cited) || {};
          pm.expect(cited.url || '', JSON.stringify(sources)).to.match(/^\/clinics\/detail\?id=[0-9a-f]{24}$/);
        });
        pm.test('the disclaimer is there', () => pm.expect(a.disclaimer).to.be.a('string').that.is.not.empty);
      }
    language: text/javascript
order: 2000
