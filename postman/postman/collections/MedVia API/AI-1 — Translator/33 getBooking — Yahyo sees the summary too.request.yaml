$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patient2Token}}
body:
  type: graphql
  content:
    query: |-
      query G($id: String!) { getBooking(bookingId: $id) { _id bookingAiSummary bookingConsents { consentType version } bookingQuestionnaire { answers { answer } } } }
    variables: |-
      { "id": "{{bookingAId}}" }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('visible to the patient', () => pm.expect((gql.getBooking || {}).bookingAiSummary).to.be.a('string').and.not.empty);
    language: text/javascript
order: 33000
