$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      query G($id: String!) { getBooking(bookingId: $id) { _id bookingAiSummary bookingConsents { consentType version } bookingQuestionnaire { answers { answer } } } }
    variables: |-
      { "id": "{{bookingBId}}" }
scripts:
  - type: beforeRequest
    code: |-
      setTimeout(() => {}, 1000);
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('no summary', () => pm.expect((gql.getBooking || {}).bookingAiSummary).to.eql(null));
    language: text/javascript
order: 38000
