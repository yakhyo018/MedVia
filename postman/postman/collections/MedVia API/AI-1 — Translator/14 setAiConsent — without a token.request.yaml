$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation C($agreed: Boolean!) { setAiConsent(agreed: $agreed) { memberAiConsentAt memberAiConsentVersion } }
    variables: |-
      { "agreed": true }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test("refused: Bearer token is not provided!", () => pm.expect(msg).to.include("Bearer token is not provided!"));
    language: text/javascript
order: 14000
