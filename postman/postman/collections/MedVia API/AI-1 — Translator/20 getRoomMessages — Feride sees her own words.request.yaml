$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      query M($input: RoomMessagesInquiry!) { getRoomMessages(input: $input) { list { _id messageType senderType messageText messageLang messageTranslations { lang text } messageTranslationStatus displayText } } }
    variables: |-
      { "input": { "roomId": "{{roomId}}", "limit": 1 } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('original for the writer', () => pm.expect((((gql.getRoomMessages || {}).list || [])[0] || {}).displayText).to.eql("Нужно ли что-то подготовить?"));
    language: text/javascript
order: 20000
