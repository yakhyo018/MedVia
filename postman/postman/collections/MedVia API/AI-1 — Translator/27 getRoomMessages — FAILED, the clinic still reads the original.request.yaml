$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      query M($input: RoomMessagesInquiry!) { getRoomMessages(input: $input) { list { _id messageType senderType messageText messageLang messageTranslations { lang text } messageTranslationStatus displayText } } }
    variables: |-
      { "input": { "roomId": "{{roomId}}", "limit": 1 } }
scripts:
  - type: beforeRequest
    code: |-
      setTimeout(() => {}, 500);
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      // The translation runs in the background: retry this request until it is done.
      const tries = Number(pm.environment.get('aiTries') || 0);
      if (!(((gql.getRoomMessages || {}).list || [])[0] && gql.getRoomMessages.list[0].messageTranslationStatus !== 'PENDING') && !body.errors && tries < 10) {
        pm.environment.set('aiTries', String(tries + 1));
        if (pm.execution && pm.execution.setNextRequest) pm.execution.setNextRequest(pm.info.requestName);
        else postman.setNextRequest(pm.info.requestName);
      } else {
        pm.environment.unset('aiTries');
        pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
        const m = ((gql.getRoomMessages || {}).list || [])[0] || {};
        pm.test('FAILED with the original shown', () => pm.expect([m.messageTranslationStatus, m.displayText]).to.eql(['FAILED', "Проверка ошибки #ai-fail"]));
      }
    language: text/javascript
order: 27000
