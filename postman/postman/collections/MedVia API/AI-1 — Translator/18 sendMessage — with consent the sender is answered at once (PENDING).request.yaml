$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation S($input: MessageSendInput!) { sendMessage(input: $input) { _id messageType senderType messageText messageLang messageTranslations { lang text } messageTranslationStatus displayText } }
    variables: |-
      { "input": { "roomId": "{{roomId}}", "messageText": "Нужно ли что-то подготовить?" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('PENDING', () => pm.expect((gql.sendMessage || {}).messageTranslationStatus).to.eql('PENDING'));
    language: text/javascript
order: 18000
