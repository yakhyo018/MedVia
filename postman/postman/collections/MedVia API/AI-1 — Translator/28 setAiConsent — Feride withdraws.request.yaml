$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation C($agreed: Boolean!) { setAiConsent(agreed: $agreed) { memberAiConsentAt memberAiConsentVersion } }
    variables: |-
      { "agreed": false }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('consent removed', () => pm.expect((gql.setAiConsent || {}).memberAiConsentAt).to.eql(null));
    language: text/javascript
order: 28000
