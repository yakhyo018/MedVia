$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      query GetClinicTreatments($input: ClinicTreatmentsInquiry!) {
        getClinicTreatments(input: $input) {
          _id treatmentName treatmentPrice treatmentDesc treatmentDraft { treatmentPrice } treatmentReviewNote doctors { _id }
        }
      }
    variables: |-
      { "input": { "clinicId": "{{clinicId}}" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const t = (gql.getClinicTreatments || []).find((x) => x._id === pm.environment.get('treatmentId')) || {};
      pm.test('live price and text', () => pm.expect([t.treatmentPrice, t.treatmentDesc]).to.eql([120000, 'Low-energy laser for even skin tone.']));
      pm.test('draft never public', () => pm.expect(t.treatmentDraft).to.be.null);
    language: text/javascript
order: 35000
