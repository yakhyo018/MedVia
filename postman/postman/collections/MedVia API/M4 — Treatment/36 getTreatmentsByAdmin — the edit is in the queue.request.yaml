$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      query Q($input: AdminTreatmentsInquiry!) {
        getTreatmentsByAdmin(input: $input) {
          list { _id treatmentStatus treatmentDraft { submittedAt } clinicData { clinicName } }
          metaCounter { total }
        }
      }
    variables: |-
      { "input": { "page": 1, "limit": 100, "reviewQueue": true } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const t = ((gql.getTreatmentsByAdmin || {}).list || []).find((x) => x._id === pm.environment.get('treatmentId')) || {};
      pm.test('an ACTIVE treatment with a draft', () => pm.expect([t.treatmentStatus, !!t.treatmentDraft]).to.eql(['ACTIVE', true]));
    language: text/javascript
order: 36000
