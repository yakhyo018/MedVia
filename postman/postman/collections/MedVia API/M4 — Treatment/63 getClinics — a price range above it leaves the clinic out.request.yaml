$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      query G($input: ClinicsInquiry!) { getClinics(input: $input) { list { _id clinicMinPrice } } }
    variables: |-
      {
        "input": { "page": 1, "limit": 50, "search": { "specialty": "DERMATOLOGY", "districts": ["GANGNAM"], "priceMin": 90001 } }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('not listed', () => pm.expect(((gql.getClinics || {}).list || []).map((x) => x._id)).to.not.include(pm.environment.get('clinicId')));
    language: text/javascript
order: 63000
