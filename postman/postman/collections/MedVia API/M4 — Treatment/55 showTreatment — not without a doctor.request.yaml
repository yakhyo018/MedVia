$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation M($id: String!) { showTreatment(treatmentId: $id) { _id treatmentStatus treatmentName treatmentPrice treatmentDuration treatmentDesc treatmentReviewNote doctorIds doctors { _id } treatmentDraft { treatmentPrice treatmentDesc treatmentName submittedAt } } }
    variables: |-
      { "id": "{{treatmentId}}" }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('refused: Assign at least one doctor before showing this treatment!', () => pm.expect(msg).to.include("Assign at least one doctor before showing this treatment!"));
      pm.test('code BAD_REQUEST', () => pm.expect(code).to.eql('BAD_REQUEST'));
    language: text/javascript
order: 55000
