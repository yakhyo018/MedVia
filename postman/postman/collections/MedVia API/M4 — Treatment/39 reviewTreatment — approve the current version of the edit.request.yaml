$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      mutation Review($input: TreatmentReviewInput!) {
        reviewTreatment(input: $input) { _id treatmentStatus treatmentName treatmentPrice treatmentDuration treatmentDesc treatmentReviewNote doctorIds doctors { _id } treatmentDraft { treatmentPrice treatmentDesc treatmentName submittedAt } }
      }
    variables: |-
      { "input": { "treatmentId": "{{treatmentId}}", "decision": "APPROVE", "draftSubmittedAt": "{{draftCurrent}}" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const t = gql.reviewTreatment || {};
      pm.test('draft applied to the live treatment', () => pm.expect([t.treatmentPrice, t.treatmentDesc]).to.eql([80000, 'Skin check before every session; interpreter included.']));
      pm.test('draft gone, still ACTIVE', () => pm.expect([t.treatmentDraft, t.treatmentStatus]).to.eql([null, 'ACTIVE']));
    language: text/javascript
order: 39000
