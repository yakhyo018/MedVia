$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{otherClinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation CreateDoctor($input: DoctorCreateInput!) { createDoctor(input: $input) { _id } }
    variables: |-
      { "input": { "memberEmail": "tdro.{{stamp}}@medvia.test", "memberPassword": "Temp#2026", "doctorName": "Other Doctor", "doctorSpecialty": "DERMATOLOGY" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.environment.set('otherDoctorId', (gql.createDoctor || {})._id || '');
    language: text/javascript
order: 8000
