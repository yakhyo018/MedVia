$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      query Q($input: AdminTreatmentsInquiry!) {
        getTreatmentsByAdmin(input: $input) {
          list { _id treatmentStatus treatmentDraft { submittedAt } clinicData { clinicName } }
          metaCounter { total }
        }
      }
    variables: |-
      { "input": { "page": 1, "limit": 100, "reviewQueue": true } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const list = (gql.getTreatmentsByAdmin || {}).list || [];
      const mine = list.filter((t) => [pm.environment.get('treatmentId'), pm.environment.get('treatment2Id')].includes(t._id));
      pm.test('both are in the queue', () => pm.expect(mine).to.have.length(2));
      pm.test('clinic name attached', () => pm.expect(mine.every((t) => (t.clinicData || {}).clinicName === pm.environment.get('clinicName'))).to.be.true);
    language: text/javascript
order: 21000
