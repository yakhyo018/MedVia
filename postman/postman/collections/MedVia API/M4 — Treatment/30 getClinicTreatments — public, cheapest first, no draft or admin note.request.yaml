$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      query GetClinicTreatments($input: ClinicTreatmentsInquiry!) {
        getClinicTreatments(input: $input) {
          _id treatmentName treatmentPrice treatmentDesc treatmentDraft { treatmentPrice } treatmentReviewNote doctors { _id }
        }
      }
    variables: |-
      { "input": { "clinicId": "{{clinicId}}" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const list = gql.getClinicTreatments || [];
      pm.test('two treatments, cheapest first', () => pm.expect(list.map((t) => t._id)).to.eql([pm.environment.get('treatmentId'), pm.environment.get('treatment2Id')]));
      pm.test('no internal fields', () => pm.expect(list.every((t) => t.treatmentDraft === null && t.treatmentReviewNote === null)).to.be.true);
      pm.test('doctor chips', () => pm.expect(((list[0] || {}).doctors || []).length).to.eql(2));
    language: text/javascript
order: 30000
