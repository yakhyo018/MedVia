$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation CreateTreatment($input: TreatmentCreateInput!) {
        createTreatment(input: $input) { _id treatmentStatus treatmentName treatmentPrice treatmentDuration treatmentDesc treatmentReviewNote doctorIds doctors { _id } treatmentDraft { treatmentPrice treatmentDesc treatmentName submittedAt } }
      }
    variables: |-
      {
        "input": {
          "treatmentName": "{{treatmentName}}", "treatmentCategory": "PIGMENTATION", "treatmentDuration": 30,
          "treatmentPrice": 99000, "treatmentPriceNote": "Per session, before tax",
          "treatmentDesc": "Low-energy laser for even skin tone.", "treatmentLangs": ["KO", "EN", "RU"],
          "treatmentAftercare": "Use SPF 50 for 7 days.", "doctorIds": ["{{doctorAId}}", "{{doctorBId}}"]
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const t = gql.createTreatment || {};
      pm.test('status PENDING', () => pm.expect(t.treatmentStatus).to.eql('PENDING'));
      pm.test('both doctors attached', () => pm.expect((t.doctors || []).map((d) => d._id)).to.eql([pm.environment.get('doctorAId'), pm.environment.get('doctorBId')]));
      pm.environment.set('treatmentId', t._id || '');
    language: text/javascript
order: 13000
