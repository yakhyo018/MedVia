$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation UpdateTreatment($input: TreatmentUpdate!) {
        updateTreatment(input: $input) { _id treatmentStatus treatmentName treatmentPrice treatmentDuration treatmentDesc treatmentReviewNote doctorIds doctors { _id } treatmentDraft { treatmentPrice treatmentDesc treatmentName submittedAt } }
      }
    variables: |-
      {
        "input": { "treatmentId": "{{treatmentId}}", "treatmentDesc": "Skin check before every session; interpreter included." }
      }
scripts:
  - type: beforeRequest
    code: |-
      setTimeout(() => {}, 50);
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const d = (gql.updateTreatment || {}).treatmentDraft || {};
      pm.test('draft keeps the lower price and takes the new text', () => pm.expect([d.treatmentPrice, d.treatmentDesc]).to.eql([80000, 'Skin check before every session; interpreter included.']));
      pm.test('a new draft version', () => pm.expect(d.submittedAt).to.not.eql(pm.environment.get('draftSeen')));
      pm.environment.set('draftCurrent', d.submittedAt || '');
    language: text/javascript
order: 37000
