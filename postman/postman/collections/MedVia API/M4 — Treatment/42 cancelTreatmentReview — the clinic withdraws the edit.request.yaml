$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation C($id: String!) { cancelTreatmentReview(treatmentId: $id) { _id treatmentStatus treatmentName treatmentPrice treatmentDuration treatmentDesc treatmentReviewNote doctorIds doctors { _id } treatmentDraft { treatmentPrice treatmentDesc treatmentName submittedAt } } }
    variables: |-
      { "id": "{{treatment2Id}}" }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const t = gql.cancelTreatmentReview || {};
      pm.test('draft dropped, live untouched', () => pm.expect([t.treatmentDraft, t.treatmentStatus, t.treatmentName]).to.eql([null, 'ACTIVE', pm.environment.get('treatment2Name')]));
    language: text/javascript
order: 42000
