$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      query GetClinicTreatments($input: ClinicTreatmentsInquiry!) {
        getClinicTreatments(input: $input) {
          _id treatmentName treatmentPrice treatmentDesc treatmentDraft { treatmentPrice } treatmentReviewNote doctors { _id }
        }
      }
    variables: |-
      { "input": { "clinicId": "not-an-id" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('refused: clinicId must be a mongodb id', () => pm.expect(msg).to.include("clinicId must be a mongodb id"));
    language: text/javascript
order: 65000
