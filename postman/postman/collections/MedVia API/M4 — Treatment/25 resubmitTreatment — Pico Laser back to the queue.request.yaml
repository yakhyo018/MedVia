$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation R($id: String!) { resubmitTreatment(treatmentId: $id) { treatmentStatus } }
    variables: |-
      { "id": "{{treatment2Id}}" }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('status PENDING', () => pm.expect((gql.resubmitTreatment || {}).treatmentStatus).to.eql('PENDING'));
    language: text/javascript
order: 25000
