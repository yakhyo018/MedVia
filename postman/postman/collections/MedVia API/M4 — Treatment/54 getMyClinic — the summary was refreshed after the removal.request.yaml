$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      query { getMyClinic { clinicMinPrice clinicTreatmentNames } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const c = gql.getMyClinic || {};
      pm.test('min ₩180,000, only Pico Laser', () => pm.expect([c.clinicMinPrice, c.clinicTreatmentNames]).to.eql([180000, [pm.environment.get('treatment2Name')]]));
    language: text/javascript
order: 54000
