$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      mutation Review($input: TreatmentReviewInput!) {
        reviewTreatment(input: $input) { _id treatmentStatus treatmentName treatmentPrice treatmentDuration treatmentDesc treatmentReviewNote doctorIds doctors { _id } treatmentDraft { treatmentPrice treatmentDesc treatmentName submittedAt } }
      }
    variables: |-
      { "input": { "treatmentId": "{{treatment2Id}}", "decision": "REJECT", "treatmentReviewNote": "No guaranteed results \u2014 medical ad rules." } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const t = gql.reviewTreatment || {};
      pm.test('draft dropped, note stored, still ACTIVE', () => pm.expect([t.treatmentDraft, t.treatmentReviewNote, t.treatmentStatus]).to.eql([null, 'No guaranteed results — medical ad rules.', 'ACTIVE']));
      pm.test('live text unchanged', () => pm.expect(t.treatmentDesc).to.eql('Low-energy laser for even skin tone.'));
    language: text/javascript
order: 45000
