$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      query Trending { top: getTrendingTreatments { treatmentName treatmentCategory specialty minPrice bookings clinics } capped: getTrendingTreatments(limit: 99) { treatmentName } }
    variables: |-
      {}
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      pm.test('no GraphQL errors (no token needed)', () => pm.expect(body.errors, msg).to.be.undefined);
      const top = gql.top || [];
      pm.test('four rows by default, each with a price and at least one clinic', () => pm.expect([top.length, top.every((r) => r.minPrice > 0 && r.clinics >= 1 && r.treatmentName)]).to.eql([4, true]));
      const ranked = top.every((r, i) => i === 0 || top[i - 1].bookings > r.bookings || (top[i - 1].bookings === r.bookings && top[i - 1].clinics >= r.clinics));
      pm.test('ranked by recent bookings, then by clinics', () => pm.expect(ranked).to.be.true);
      pm.test('the limit is capped at 12', () => pm.expect((gql.capped || []).length).to.be.at.most(12));
    language: text/javascript
order: 63000
