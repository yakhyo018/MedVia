$kind: http-request
url: '{{baseUrl}}/face-scan'
method: POST
headers:
  Authorization: Bearer {{faceToken}}
body:
  type: formdata
  content:
    - key: file
      type: file
      src: fixtures/face-photo.png
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json(); } catch (e) { return {}; } })();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';

      pm.test('HTTP 201', () => pm.response.to.have.status(201));
      pm.test('status DONE', () => pm.expect(body.faceScanStatus, JSON.stringify(body)).to.eql('DONE'));
      pm.test('findings with concern, severity, zone', () => {
        pm.expect(body.findings).to.be.an('array').that.is.not.empty;
        pm.expect(body.findings[0]).to.have.keys('concern', 'severity', 'zone');
      });
      pm.test('summary in the patient language (UZ)', () => pm.expect(body.faceScanLang).to.eql('UZ'));
      pm.test('a specialty is suggested', () => pm.expect(body.suggestedSpecialty).to.be.a('string'));
      pm.test('the disclaimer is always there', () => pm.expect(body.disclaimer).to.be.a('string').that.is.not.empty);
      pm.test('no memberId, no photo, no __v in the response', () => {
        pm.expect(body).to.not.have.any.keys('memberId', '__v', 'image', 'faceScanImage');
      });
      pm.environment.set('faceScanId', body._id || '');
    language: text/javascript
order: 4000
