$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation Signup($input: MemberInput!) {
        signup(input: $input) {
          _id
          memberType
          memberAiConsentAt
          accessToken
        }
      }
    variables: |-
      {
        "input": {
          "memberType": "USER",
          "memberEmail": "face.yahyo.{{stamp}}@medvia.test",
          "memberPassword": "Patient#2026",
          "memberFullName": "Yahyo Choriyev",
          "memberLang": "UZ",
          "termsAccepted": true
        }
      }
scripts:
  - type: beforeRequest
    code: |-
      pm.environment.set('stamp', String(Date.now()));
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json(); } catch (e) { return {}; } })();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';

      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.environment.set('faceToken', (gql.signup || {}).accessToken || '');
    language: text/javascript
order: 1000
