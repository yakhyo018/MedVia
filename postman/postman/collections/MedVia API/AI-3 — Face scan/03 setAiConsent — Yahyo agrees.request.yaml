$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{faceToken}}
body:
  type: graphql
  content:
    query: |-
      mutation SetAiConsent {
        setAiConsent(agreed: true) {
          _id
          memberAiConsentAt
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json(); } catch (e) { return {}; } })();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';

      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('consent time is set', () => pm.expect((gql.setAiConsent || {}).memberAiConsentAt).to.be.a('string'));
    language: text/javascript
order: 3000
