$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{faceToken}}
body:
  type: graphql
  content:
    query: |-
      query GetMyFaceScans($input: OrdinaryInquiry!) {
        getMyFaceScans(input: $input) {
          list {
            _id
            faceScanStatus
            findings { concern severity zone }
            qualityIssues
            faceScanSummary
            faceScanLang
            suggestedSpecialty
            aiProvider
            disclaimer
            createdAt
          }
          metaCounter { total }
        }
      }
    variables: |-
      {
        "input": { "page": 1, "limit": 10 }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = (() => { try { return pm.response.json(); } catch (e) { return {}; } })();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';

      const list = ((gql.getMyFaceScans || {}).list) || [];
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('one scan', () => pm.expect(list.length).to.eql(1));
      pm.test('it is the new scan', () => pm.expect((list[0] || {})._id).to.eql(pm.environment.get('faceScanId')));
    language: text/javascript
order: 5000
