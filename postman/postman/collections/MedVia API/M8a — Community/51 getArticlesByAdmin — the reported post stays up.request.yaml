$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      query A($input: AdminArticlesInquiry!) { getArticlesByAdmin(input: $input) { list { _id articleReports articleStatus } metaCounter { total } } }
    variables: |-
      { "input": { "page": 1, "limit": 100, "articleCategory": "FREE" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const a = ((gql.getArticlesByAdmin || {}).list || []).find((x) => x._id === pm.environment.get('freeId')) || {};
      pm.test('ACTIVE, the one pending report counted', () => pm.expect([a.articleStatus, a.articleReports]).to.eql(['ACTIVE', 1]));
    language: text/javascript
order: 51000
