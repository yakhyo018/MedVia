$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation UC($input: CommentUpdate!) { updateComment(input: $input) { _id commentStatus commentContent authorName authorType } }
    variables: |-
      { "input": { "commentId": "{{doctorCommentId}}", "commentContent": "Changed" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test("refused: No data is found!", () => pm.expect(msg).to.include("No data is found!"));
      pm.test('code NOT_FOUND', () => pm.expect(code).to.eql('NOT_FOUND'));
    language: text/javascript
order: 34000
