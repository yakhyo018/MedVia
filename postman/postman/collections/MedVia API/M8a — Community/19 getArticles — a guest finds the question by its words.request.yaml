$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      query L($input: ArticlesInquiry!) { getArticles(input: $input) { list { _id articleCategory articleStatus articleTitle articleAnswered articleLikes articleViews articleComments authorName authorType meLiked } metaCounter { total } } }
    variables: |-
      { "input": { "page": 1, "limit": 10, "search": { "articleCategory": "QNA", "text": "{{token}}" } } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const l = gql.getArticles || {};
      pm.test('exactly the question, no like flag for a guest', () => pm.expect([(l.list || []).map((a) => a._id), ((l.list || [])[0] || {}).meLiked]).to.eql([[pm.environment.get('qnaId')], null]));
    language: text/javascript
order: 19000
