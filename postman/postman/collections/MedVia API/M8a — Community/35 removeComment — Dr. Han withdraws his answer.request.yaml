$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{doctorToken}}
body:
  type: graphql
  content:
    query: |-
      mutation RC($id: String!) { removeComment(commentId: $id) { _id commentStatus } }
    variables: |-
      { "id": "{{doctorCommentId}}" }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('DELETE', () => pm.expect((gql.removeComment || {}).commentStatus).to.eql('DELETE'));
    language: text/javascript
order: 35000
