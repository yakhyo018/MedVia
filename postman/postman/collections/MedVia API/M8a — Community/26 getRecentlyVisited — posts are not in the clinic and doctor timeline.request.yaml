$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patient2Token}}
body:
  type: graphql
  content:
    query: |-
      query RV($input: OrdinaryInquiry!) { getRecentlyVisited(input: $input) { metaCounter { total } } }
    variables: |-
      { "input": { "page": 1, "limit": 10 } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('empty', () => pm.expect((((gql.getRecentlyVisited || {}).metaCounter || [])[0] || {}).total || 0).to.eql(0));
    language: text/javascript
order: 26000
