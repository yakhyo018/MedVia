$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation Rep($input: ReportInput!) { reportContent(input: $input) { _id reportStatus reportGroup } }
    variables: |-
      { "input": { "reportGroup": "ARTICLE", "reportRefId": "{{freeId}}", "reportReason": "ADVERTISING" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('PENDING', () => pm.expect((gql.reportContent || {}).reportStatus).to.eql('PENDING'));
    language: text/javascript
order: 40000
