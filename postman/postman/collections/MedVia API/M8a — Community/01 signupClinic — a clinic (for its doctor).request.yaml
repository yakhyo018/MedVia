$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation S($input: ClinicSignupInput!) { signupClinic(input: $input) { accessToken } }
    variables: |-
      { "input": { "memberEmail": "mclinic.{{stamp}}@medvia.test", "memberPassword": "Clinic#2026", "memberFullName": "Kim Ji-won", "clinicName": "Community Test Clinic {{stamp}}", "clinicSpecialty": "DERMATOLOGY", "clinicDistrict": "GANGNAM", "clinicAddress": "12 Teheran-ro, Gangnam-gu, Seoul", "termsAccepted": true, "authorizedConfirmed": true } }
scripts:
  - type: beforeRequest
    code: |-
      const stamp = Date.now();
      pm.environment.set('stamp', String(stamp));
      // A token only these posts carry, so the searches find exactly them.
      pm.environment.set('token', 'mq' + stamp.toString(36));
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.environment.set('clinicToken', (gql.signupClinic || {}).accessToken || '');
    language: text/javascript
order: 1000
