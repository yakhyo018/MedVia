$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patient2Token}}
body:
  type: graphql
  content:
    query: |-
      mutation C($input: ArticleInput!) { createArticle(input: $input) { _id articleCategory articleStatus articleTitle articleAnswered articleLikes articleViews articleComments authorName authorType meLiked } }
    variables: |-
      { "input": { "articleCategory": "FREE", "articleTitle": "Where to exchange money near Gangnam? {{token}}", "articleContent": "Looking for a money exchange with a fair rate near the station.", "articleLang": "UZ" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.environment.set('freeId', (gql.createArticle || {})._id || '');
    language: text/javascript
order: 17000
