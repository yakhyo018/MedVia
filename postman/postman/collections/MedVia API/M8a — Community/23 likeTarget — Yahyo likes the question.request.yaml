$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patient2Token}}
body:
  type: graphql
  content:
    query: |-
      mutation Like($input: LikeTargetInput!) { likeTarget(input: $input) { meLiked likes } }
    variables: |-
      { "input": { "likeGroup": "ARTICLE", "likeRefId": "{{qnaId}}" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('liked, 1', () => pm.expect([(gql.likeTarget || {}).meLiked, (gql.likeTarget || {}).likes]).to.eql([true, 1]));
    language: text/javascript
order: 23000
