$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      query GC($input: CommentsInquiry!) { getComments(input: $input) { list { _id commentStatus commentContent authorName authorType } metaCounter { total } } }
    variables: |-
      { "input": { "articleId": "{{qnaId}}", "page": 1, "limit": 10 } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('patient, then doctor', () => pm.expect(((gql.getComments || {}).list || []).map((c) => c.authorType)).to.eql(['USER', 'DOCTOR']));
    language: text/javascript
order: 33000
