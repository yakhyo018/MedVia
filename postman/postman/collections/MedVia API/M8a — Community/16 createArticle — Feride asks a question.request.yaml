$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation C($input: ArticleInput!) { createArticle(input: $input) { _id articleCategory articleStatus articleTitle articleAnswered articleLikes articleViews articleComments authorName authorType meLiked } }
    variables: |-
      { "input": { "articleCategory": "QNA", "articleTitle": "Can I do laser toning with melasma? {{token}}", "articleContent": "I read that some lasers make melasma worse. Which treatment is safer?", "articleLang": "RU" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const a = gql.createArticle || {};
      pm.test('ACTIVE, not answered, short author name', () => pm.expect([a.articleStatus, a.articleAnswered, a.authorName, a.authorType]).to.eql(['ACTIVE', false, 'Feride K.', 'USER']));
      pm.environment.set('qnaId', a._id || '');
    language: text/javascript
order: 16000
