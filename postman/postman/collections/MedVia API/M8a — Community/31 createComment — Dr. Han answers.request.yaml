$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{doctorToken}}
body:
  type: graphql
  content:
    query: |-
      mutation CC($input: CommentInput!) { createComment(input: $input) { _id commentStatus commentContent authorName authorType } }
    variables: |-
      { "input": { "articleId": "{{qnaId}}", "commentContent": "기미가 있어도 저출력 레이저 토닝은 가능하지만 먼저 상담이 필요합니다.", "commentLang": "KO" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const c = gql.createComment || {};
      pm.test('a doctor\'s answer', () => pm.expect([c.authorName, c.authorType]).to.eql(['Dr. Han Seo-yeon', 'DOCTOR']));
      pm.environment.set('doctorCommentId', c._id || '');
    language: text/javascript
order: 31000
