$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      query L($input: ArticlesInquiry!) { getArticles(input: $input) { list { _id articleCategory articleStatus articleTitle articleAnswered articleLikes articleViews articleComments authorName authorType meLiked } metaCounter { total } } }
    variables: |-
      { "input": { "page": 1, "limit": 10, "search": { "text": "(a+)+$" } } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('answered, nothing matches', () => pm.expect((((gql.getArticles || {}).metaCounter || [])[0] || {}).total || 0).to.eql(0));
    language: text/javascript
order: 20000
