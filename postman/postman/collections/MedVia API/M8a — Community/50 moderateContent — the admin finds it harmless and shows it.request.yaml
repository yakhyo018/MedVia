$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      mutation M($input: ModerationInput!) { moderateContent(input: $input) { refId status reportsClosed } }
    variables: |-
      { "input": { "reportGroup": "ARTICLE", "refId": "{{freeId}}", "decision": "SHOW", "note": "A question about money exchange, not an advert." } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const r = gql.moderateContent || {};
      pm.test('ACTIVE, 5 reports dismissed', () => pm.expect([r.status, r.reportsClosed]).to.eql(['ACTIVE', 5]));
    language: text/javascript
order: 50000
