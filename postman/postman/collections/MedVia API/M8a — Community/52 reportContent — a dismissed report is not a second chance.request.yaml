$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{reporter1Token}}
body:
  type: graphql
  content:
    query: |-
      mutation Rep($input: ReportInput!) { reportContent(input: $input) { _id reportStatus reportGroup } }
    variables: |-
      { "input": { "reportGroup": "ARTICLE", "reportRefId": "{{freeId}}", "reportReason": "SPAM" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test("refused: You have already reported this!", () => pm.expect(msg).to.include("You have already reported this!"));
      pm.test('code BAD_REQUEST', () => pm.expect(code).to.eql('BAD_REQUEST'));
    language: text/javascript
order: 52000
