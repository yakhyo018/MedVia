$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patient2Token}}
body:
  type: graphql
  content:
    query: |-
      mutation CC($input: CommentInput!) { createComment(input: $input) { _id commentStatus commentContent authorName authorType } }
    variables: |-
      { "input": { "articleId": "{{qnaId}}", "commentContent": "My doctor suggested a test spot first.", "commentLang": "EN" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('Yahyo C.', () => pm.expect((gql.createComment || {}).authorName).to.eql('Yahyo C.'));
    language: text/javascript
order: 29000
