$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      query GetRecentlyVisited($input: OrdinaryInquiry!) {
        getRecentlyVisited(input: $input) {
          list { viewGroup visitedAt clinic { _id } doctor { _id clinicData { clinicName } } }
          metaCounter { total }
        }
      }
    variables: |-
      { "input": { "page": 1, "limit": 10 } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const page = gql.getRecentlyVisited || {};
      const list = page.list || [];
      pm.test('two entries', () => pm.expect(page.metaCounter).to.eql([{ total: 2 }]));
      pm.test('clinic first (visited last), then the doctor', () => pm.expect(list.map((v) => v.viewGroup)).to.eql(['CLINIC', 'DOCTOR']));
      pm.test('doctor entry carries the clinic name', () => pm.expect((((list[1] || {}).doctor || {}).clinicData || {}).clinicName).to.eql(pm.environment.get('clinicName')));
    language: text/javascript
order: 40000
