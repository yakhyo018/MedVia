$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation FollowMember($input: FollowInput!) {
        followMember(input: $input) {
          followingType followingMember { memberDisplayName }
          followingDoctor { _id doctorFollowers }
        }
      }
    variables: |-
      { "input": { "memberId": "{{doctorMemberId}}" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('refused: This member cannot be followed!', () => pm.expect(msg).to.include("This member cannot be followed!"));
      pm.test('code BAD_REQUEST', () => pm.expect(code).to.eql('BAD_REQUEST'));
    language: text/javascript
order: 62000
