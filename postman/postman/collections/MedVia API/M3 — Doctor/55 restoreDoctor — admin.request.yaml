$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      mutation RestoreDoctor($input: DoctorStatusInput!) {
        restoreDoctor(input: $input) { _id doctorStatus }
      }
    variables: |-
      { "input": { "doctorId": "{{doctorId}}", "note": "Resolved." } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('status ACTIVE', () => pm.expect((gql.restoreDoctor || {}).doctorStatus).to.eql('ACTIVE'));
    language: text/javascript
order: 55000
