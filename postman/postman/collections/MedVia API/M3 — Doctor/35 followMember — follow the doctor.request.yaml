$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation FollowMember($input: FollowInput!) {
        followMember(input: $input) {
          followingType followingMember { memberDisplayName }
          followingDoctor { _id doctorFollowers }
        }
      }
    variables: |-
      { "input": { "memberId": "{{doctorMemberId}}" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const f = gql.followMember || {};
      pm.test('followingType DOCTOR', () => pm.expect(f.followingType).to.eql('DOCTOR'));
      pm.test('doctor card, doctorFollowers 1', () => pm.expect([(f.followingDoctor || {})._id, (f.followingDoctor || {}).doctorFollowers]).to.eql([pm.environment.get('doctorId'), 1]));
      pm.test('a doctor shows the full name', () => pm.expect((f.followingMember || {}).memberDisplayName).to.eql(pm.environment.get('doctorName')));
    language: text/javascript
order: 35000
