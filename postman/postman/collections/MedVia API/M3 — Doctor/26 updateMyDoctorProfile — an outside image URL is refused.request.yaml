$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{doctorToken}}
body:
  type: graphql
  content:
    query: |-
      mutation UpdateMyDoctorProfile($input: DoctorProfileUpdate!) {
        updateMyDoctorProfile(input: $input) {
          _id doctorNameKo doctorImage doctorBio doctorSpecialty
          doctorCareer { title place from to }
        }
      }
    variables: |-
      { "input": { "doctorImage": "https://tracker.example.com/pixel.png" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('refused: doctorImage must be a path returned by /upload/image', () => pm.expect(msg).to.include("doctorImage must be a path returned by /upload/image"));
    language: text/javascript
order: 26000
