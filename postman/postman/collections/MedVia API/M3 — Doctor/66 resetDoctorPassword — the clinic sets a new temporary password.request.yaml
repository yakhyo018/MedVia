$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation ResetDoctorPassword($input: DoctorPasswordReset!) {
        resetDoctorPassword(input: $input)
      }
    variables: |-
      { "input": { "doctorId": "{{doctorId}}", "newPassword": "Reset#2026" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('returns true', () => pm.expect(gql.resetDoctorPassword).to.eql(true));
    language: text/javascript
order: 66000
