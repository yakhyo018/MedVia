$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation UpdateDoctorByClinic($input: DoctorClinicUpdate!) {
        updateDoctorByClinic(input: $input) { _id doctorSpecialty }
      }
    variables: |-
      { "input": { "doctorId": "{{doctorId}}", "doctorSpecialty": "CHECK_UP" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('specialty CHECK_UP', () => pm.expect((gql.updateDoctorByClinic || {}).doctorSpecialty).to.eql('CHECK_UP'));
    language: text/javascript
order: 29000
