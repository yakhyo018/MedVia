$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      query GetAllDoctorsByAdmin($input: AdminDoctorsInquiry!) {
        getAllDoctorsByAdmin(input: $input) {
          list { _id doctorStatus clinicData { clinicName } memberData { memberEmail memberType } }
          metaCounter { total }
        }
      }
    variables: |-
      { "input": { "page": 1, "limit": 10, "text": "{{doctorName}}" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const d = ((gql.getAllDoctorsByAdmin || {}).list || [])[0] || {};
      pm.test('the doctor', () => pm.expect(d._id).to.eql(pm.environment.get('doctorId')));
      pm.test('clinic and account attached', () => pm.expect([(d.clinicData || {}).clinicName, (d.memberData || {}).memberEmail]).to.eql([pm.environment.get('clinicName'), pm.environment.get('doctorEmail')]));
    language: text/javascript
order: 56000
