$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      query GetAuditLogsByAdmin($input: AuditLogsInquiry!) {
        getAuditLogsByAdmin(input: $input) { auditAction auditNote }
      }
    variables: |-
      { "input": { "auditGroup": "DOCTOR", "auditRefId": "{{doctorId}}" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('restore, then suspend — newest first', () => pm.expect((gql.getAuditLogsByAdmin || []).map((l) => l.auditAction)).to.eql(['DOCTOR_RESTORE', 'DOCTOR_SUSPEND']));
    language: text/javascript
order: 57000
