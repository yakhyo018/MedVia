$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      query GetDoctor($doctorId: String!) {
        getDoctor(doctorId: $doctorId) {
          _id doctorName doctorSpecialty doctorStatus doctorLikes doctorFollowers memberId meLiked meFollowed
          clinicData { _id clinicName clinicStatus }
          memberData { memberEmail }
        }
      }
    variables: |-
      { "doctorId": "{{doctorId}}" }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('refused: No data is found!', () => pm.expect(msg).to.include("No data is found!"));
      pm.test('code NOT_FOUND', () => pm.expect(code).to.eql('NOT_FOUND'));
    language: text/javascript
order: 12000
