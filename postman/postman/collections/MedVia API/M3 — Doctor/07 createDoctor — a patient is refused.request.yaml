$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation CreateDoctor($input: DoctorCreateInput!) {
        createDoctor(input: $input) {
          _id doctorStatus doctorName doctorSpecialty doctorLangs clinicId memberId
          doctorLikes doctorViews doctorFollowers
          memberData { memberType memberEmail memberFullName memberMustChangePassword }
        }
      }
    variables: |-
      {
        "input": {
          "memberEmail": "{{doctorEmail}}",
          "memberPassword": "Temp#2026",
          "doctorName": "{{doctorName}}",
          "doctorSpecialty": "DERMATOLOGY",
          "doctorLangs": ["KO", "EN", "RU"],
          "doctorExperience": 12
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('refused: Allowed only for members with specific roles!', () => pm.expect(msg).to.include("Allowed only for members with specific roles!"));
      pm.test('code FORBIDDEN', () => pm.expect(code).to.eql('FORBIDDEN'));
    language: text/javascript
order: 7000
