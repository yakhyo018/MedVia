$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      query GetMyClinicDoctors {
        getMyClinicDoctors { _id doctorStatus doctorName memberData { memberEmail } }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const list = gql.getMyClinicDoctors || [];
      pm.test('one doctor', () => pm.expect(list).to.have.length(1));
      pm.test('login email for the clinic', () => pm.expect(((list[0] || {}).memberData || {}).memberEmail).to.eql(pm.environment.get('doctorEmail')));
    language: text/javascript
order: 27000
