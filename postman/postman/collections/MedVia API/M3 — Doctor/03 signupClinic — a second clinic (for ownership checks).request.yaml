$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation SignupClinic($input: ClinicSignupInput!) {
        signupClinic(input: $input) { _id memberType accessToken }
      }
    variables: |-
      {
        "input": {
          "memberEmail": "{{otherClinicEmail}}",
          "memberPassword": "Clinic#2026",
          "memberFullName": "Kim Ji-won",
          "clinicName": "{{otherClinicName}}",
          "clinicSpecialty": "DERMATOLOGY",
          "clinicDistrict": "GANGNAM",
          "clinicAddress": "12 Teheran-ro, Gangnam-gu, Seoul",
          "termsAccepted": true,
          "authorizedConfirmed": true
        }
      }
scripts:
  - type: beforeRequest
    code: |-
      pm.environment.set('otherClinicEmail', 'other.' + pm.environment.get('clinicEmail'));
      pm.environment.set('otherClinicName', 'Other ' + pm.environment.get('clinicName'));
    language: text/javascript
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.environment.set('otherClinicToken', (gql.signupClinic || {}).accessToken || '');
    language: text/javascript
order: 3000
