$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      query GetDoctors($input: DoctorsInquiry!) {
        getDoctors(input: $input) { list { _id doctorLikes doctorFollowers meLiked meFollowed } }
      }
    variables: |-
      { "input": { "page": 1, "limit": 10, "search": { "clinicId": "{{clinicId}}" } } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const d = ((gql.getDoctors || {}).list || [])[0] || {};
      pm.test('the doctor card', () => pm.expect(d._id).to.eql(pm.environment.get('doctorId')));
      pm.test('no personal flags for a guest', () => pm.expect([d.meLiked, d.meFollowed]).to.eql([null, null]));
    language: text/javascript
order: 37200
