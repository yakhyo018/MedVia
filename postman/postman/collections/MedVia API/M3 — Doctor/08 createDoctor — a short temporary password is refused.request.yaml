$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation CreateDoctor($input: DoctorCreateInput!) {
        createDoctor(input: $input) {
          _id doctorStatus doctorName doctorSpecialty doctorLangs clinicId memberId
          doctorLikes doctorViews doctorFollowers
          memberData { memberType memberEmail memberFullName memberMustChangePassword }
        }
      }
    variables: |-
      {
        "input": {
          "memberEmail": "{{doctorEmail}}",
          "memberPassword": "short",
          "doctorName": "{{doctorName}}",
          "doctorSpecialty": "DERMATOLOGY",
          "doctorLangs": ["KO", "EN", "RU"],
          "doctorExperience": 12
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('refused: memberPassword must be longer than or equal to 8', () => pm.expect(msg).to.include("memberPassword must be longer than or equal to 8"));
    language: text/javascript
order: 8000
