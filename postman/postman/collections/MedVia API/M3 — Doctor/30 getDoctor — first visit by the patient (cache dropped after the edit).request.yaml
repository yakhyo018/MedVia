$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      query GetDoctor($doctorId: String!) {
        getDoctor(doctorId: $doctorId) {
          _id doctorName doctorSpecialty doctorStatus doctorLikes doctorFollowers memberId meLiked meFollowed
          clinicData { _id clinicName clinicStatus }
          memberData { memberEmail }
        }
      }
    variables: |-
      { "doctorId": "{{doctorId}}" }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const d = gql.getDoctor || {};
      pm.test('the new specialty, not a stale cached page', () => pm.expect(d.doctorSpecialty).to.eql('CHECK_UP'));
      pm.test('not liked, not followed', () => pm.expect([d.meLiked, d.meFollowed]).to.eql([false, false]));
    language: text/javascript
order: 30000
