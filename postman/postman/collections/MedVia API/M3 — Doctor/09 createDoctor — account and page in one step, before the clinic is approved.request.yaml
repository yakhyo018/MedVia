$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation CreateDoctor($input: DoctorCreateInput!) {
        createDoctor(input: $input) {
          _id doctorStatus doctorName doctorSpecialty doctorLangs clinicId memberId
          doctorLikes doctorViews doctorFollowers
          memberData { memberType memberEmail memberFullName memberMustChangePassword }
        }
      }
    variables: |-
      {
        "input": {
          "memberEmail": "{{doctorEmail}}",
          "memberPassword": "Temp#2026",
          "doctorName": "{{doctorName}}",
          "doctorSpecialty": "DERMATOLOGY",
          "doctorLangs": ["KO", "EN", "RU"],
          "doctorExperience": 12
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const d = gql.createDoctor || {};
      const m = d.memberData || {};
      pm.test('doctor ACTIVE', () => pm.expect(d.doctorStatus).to.eql('ACTIVE'));
      pm.test('belongs to the clinic', () => pm.expect(d.clinicId).to.eql(pm.environment.get('clinicId')));
      pm.test('a DOCTOR account with the same name', () => pm.expect([m.memberType, m.memberFullName]).to.eql(['DOCTOR', pm.environment.get('doctorName')]));
      pm.test('must change the temporary password', () => pm.expect(m.memberMustChangePassword).to.eql(true));
      pm.test('counters start at zero', () => pm.expect([d.doctorLikes, d.doctorViews, d.doctorFollowers]).to.eql([0, 0, 0]));
      pm.environment.set('doctorId', d._id || '');
      pm.environment.set('doctorMemberId', d.memberId || '');
    language: text/javascript
order: 9000
