$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{doctorToken}}
body:
  type: graphql
  content:
    query: |-
      mutation UpdateMyDoctorProfile($input: DoctorProfileUpdate!) {
        updateMyDoctorProfile(input: $input) {
          _id doctorNameKo doctorImage doctorBio doctorSpecialty
          doctorCareer { title place from to }
        }
      }
    variables: |-
      { "input": { "doctorSpecialty": "DENTAL" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('refused by the GraphQL schema itself', () => pm.expect(msg).to.include('doctorSpecialty'));
      pm.test('nothing was returned', () => pm.expect(body.data == null || gql.updateMyDoctorProfile == null).to.be.true);
    language: text/javascript
order: 24000
