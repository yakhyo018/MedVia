$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      mutation LikeTargetDoctor($doctorId: String!) {
        likeTargetDoctor(doctorId: $doctorId) { _id doctorLikes meLiked }
      }
    variables: |-
      { "doctorId": "{{doctorId}}" }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const d = gql.likeTargetDoctor || {};
      pm.test('doctorLikes 1, meLiked', () => pm.expect([d.doctorLikes, d.meLiked]).to.eql([1, true]));
    language: text/javascript
order: 33000
