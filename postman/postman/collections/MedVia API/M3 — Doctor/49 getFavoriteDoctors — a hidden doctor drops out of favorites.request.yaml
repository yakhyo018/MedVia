$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      query GetFavoriteDoctors($input: OrdinaryInquiry!) {
        getFavoriteDoctors(input: $input) { list { _id clinicData { clinicName } } metaCounter { total } }
      }
    variables: |-
      { "input": { "page": 1, "limit": 10 } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('no favorite doctors listed', () => pm.expect((gql.getFavoriteDoctors || {}).list).to.eql([]));
    language: text/javascript
order: 49000
