$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{doctorToken}}
body:
  type: graphql
  content:
    query: |-
      query GetMyDoctorProfile {
        getMyDoctorProfile {
          _id doctorName doctorNameKo doctorSpecialty doctorImage doctorBio doctorViews doctorLikes doctorFollowers
          doctorCareer { title place from to }
          clinicData { clinicName }
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('refused: You are not authenticated, login first!', () => pm.expect(msg).to.include("You are not authenticated, login first!"));
    language: text/javascript
