$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      query GetFavoriteDoctors($input: OrdinaryInquiry!) {
        getFavoriteDoctors(input: $input) { list { _id clinicData { clinicName } } metaCounter { total } }
      }
    variables: |-
      { "input": { "page": 1, "limit": 10 } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const page = gql.getFavoriteDoctors || {};
      const d = (page.list || [])[0] || {};
      pm.test('one favorite doctor', () => pm.expect(page.metaCounter).to.eql([{ total: 1 }]));
      pm.test('this doctor, clinic attached', () => pm.expect([d._id, (d.clinicData || {}).clinicName]).to.eql([pm.environment.get('doctorId'), pm.environment.get('clinicName')]));
    language: text/javascript
order: 34000
