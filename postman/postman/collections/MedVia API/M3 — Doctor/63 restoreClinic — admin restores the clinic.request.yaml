$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      mutation RestoreClinic($input: ClinicStatusInput!) {
        restoreClinic(input: $input) { clinicStatus }
      }
    variables: |-
      { "input": { "clinicId": "{{clinicId}}", "note": "M3 visibility check" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('clinic ACTIVE', () => pm.expect((gql.restoreClinic || {}).clinicStatus).to.eql('ACTIVE'));
    language: text/javascript
order: 63000
