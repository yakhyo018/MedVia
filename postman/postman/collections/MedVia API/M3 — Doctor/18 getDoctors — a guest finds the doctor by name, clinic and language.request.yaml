$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      query GetDoctors($input: DoctorsInquiry!) {
        getDoctors(input: $input) {
          list { _id doctorName doctorLangs clinicData { _id clinicName } }
          metaCounter { total }
        }
      }
    variables: |-
      {
        "input": {
          "page": 1,
          "limit": 10,
          "search": { "text": "{{doctorName}}", "clinicId": "{{clinicId}}", "langs": ["RU"], "specialty": "DERMATOLOGY" }
        }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const page = gql.getDoctors || {};
      const d = (page.list || [])[0] || {};
      pm.test('exactly one doctor', () => pm.expect(page.metaCounter).to.eql([{ total: 1 }]));
      pm.test('the doctor, with the clinic card', () => pm.expect([d._id, (d.clinicData || {})._id]).to.eql([pm.environment.get('doctorId'), pm.environment.get('clinicId')]));
    language: text/javascript
order: 18000
