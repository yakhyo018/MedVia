$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      query GetMyFollowings($input: FollowingsInquiry!) {
        getMyFollowings(input: $input) {
          list { followingType followingDoctor { _id clinicData { clinicName } } }
          metaCounter { total }
          typeCounts { followingType total }
        }
      }
    variables: |-
      { "input": { "page": 1, "limit": 10, "followingType": "DOCTOR" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const page = gql.getMyFollowings || {};
      const d = ((page.list || [])[0] || {}).followingDoctor || {};
      pm.test('one doctor followed', () => pm.expect(page.metaCounter).to.eql([{ total: 1 }]));
      pm.test('doctor card with clinic', () => pm.expect([d._id, (d.clinicData || {}).clinicName]).to.eql([pm.environment.get('doctorId'), pm.environment.get('clinicName')]));
      pm.test('badge: Doctors (1)', () => pm.expect(page.typeCounts).to.eql([{ followingType: 'DOCTOR', total: 1 }]));
    language: text/javascript
order: 36000
