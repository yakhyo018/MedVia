$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
body:
  type: graphql
  content:
    query: |-
      mutation Login($input: LoginInput!) {
        login(input: $input) { _id memberType memberMustChangePassword accessToken }
      }
    variables: |-
      { "input": { "memberEmail": "{{doctorEmail}}", "memberPassword": "Reset#2026" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('refused: Wrong email or password!', () => pm.expect(msg).to.include("Wrong email or password!"));
    language: text/javascript
order: 72000
