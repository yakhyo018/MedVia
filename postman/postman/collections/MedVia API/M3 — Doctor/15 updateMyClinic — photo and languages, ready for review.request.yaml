$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      mutation UpdateMyClinic($input: ClinicUpdate!) {
        updateMyClinic(input: $input) { _id clinicImages clinicLangs }
      }
    variables: |-
      { "input": { "clinicImages": ["{{clinicImage}}"], "clinicLangs": ["KO", "EN", "RU"] } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
    language: text/javascript
order: 15000
