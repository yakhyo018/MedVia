$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      query F($input: AuditFeedInquiry!) { getAuditFeedByAdmin(input: $input) { list { _id auditAction auditGroup auditRefId auditNote memberId adminName createdAt } metaCounter { total } } }
    variables: |-
      { "input": { "page": 1, "limit": 20, "auditGroup": "MEMBER", "memberId": "{{adminId}}", "from": "{{startedAt}}" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const list = (gql.getAuditFeedByAdmin || {}).list || [];
      const mine = list.filter((l) => l.auditRefId === pm.environment.get('patient2Id'));
      pm.test("Yahyo's two lines, newest first", () => pm.expect(mine.map((l) => l.auditAction)).to.eql(['MEMBER_UNBLOCK', 'MEMBER_BLOCK']));
      pm.test('only MEMBER, only this admin', () => pm.expect(list.every((l) => l.auditGroup === 'MEMBER' && l.memberId === pm.environment.get('adminId'))).to.be.true);
      pm.test('the admin is named', () => pm.expect((list[0] || {}).adminName).to.be.a('string').and.not.empty);
    language: text/javascript
order: 58000
