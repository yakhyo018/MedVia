$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      query Dashboard {
        bookings: getBookingStatsByAdmin { today waitingForClinic last14Days { date count } languages { lang share } }
        clinics: getClinicsByAdmin(input: { page: 1, limit: 1, clinicStatus: PENDING }) { metaCounter { total } }
        reviews: getReviewsByAdmin(input: { page: 1, limit: 1, reviewStatus: PENDING }) { metaCounter { total } }
        reports: getReportsByAdmin(input: { page: 1, limit: 1, reportStatus: PENDING }) { metaCounter { total } }
        recent: getAuditFeedByAdmin(input: { page: 1, limit: 10 }) { list { auditAction auditGroup adminName createdAt } }
        batch: getBatchStatusByAdmin { batches { batchName batchStatus finishedAt } }
      }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('every card answered', () => pm.expect(['bookings', 'clinics', 'reviews', 'reports', 'recent', 'batch'].every((k) => gql[k])).to.be.true);
      pm.test('the report against Feride is pending', () => pm.expect((((gql.reports || {}).metaCounter || [])[0] || {}).total).to.be.at.least(1));
      pm.test('recent activity starts with the notice removal', () => pm.expect((((gql.recent || {}).list || [])[0] || {}).auditAction).to.eql('NOTICE_REMOVE'));
    language: text/javascript
order: 65000
