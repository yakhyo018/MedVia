$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      query H($input: AuditLogsInquiry!) { getAuditLogsByAdmin(input: $input) { _id auditAction auditGroup auditRefId auditNote memberId adminName createdAt } }
    variables: |-
      { "input": { "auditGroup": "NOTICE", "auditRefId": "{{noticeId}}" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const lines = gql.getAuditLogsByAdmin || [];
      const actions = lines.map((l) => l.auditAction);
      pm.test('REMOVE, UNPUBLISH, PUBLISH', () => pm.expect(actions).to.eql(['NOTICE_REMOVE', 'NOTICE_UNPUBLISH', 'NOTICE_PUBLISH']));
    language: text/javascript
order: 57000
