$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      query A($input: OrdinaryInquiry!) { getMyAccessLogs(input: $input) { list { _id accessType bookingId bookingCode patientId readerId readerType readerName createdAt } metaCounter { total } } }
    variables: |-
      { "input": { "page": 1, "limit": 50 } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const env = (key) => pm.environment.get(key);
      const res = gql.getMyAccessLogs || gql.getAccessLogsByAdmin || {};
      const list = res.list || [];
      const total = ((res.metaCounter || [])[0] || {}).total || 0;
      const ofType = (readerType, accessType) => list.filter((l) => l.readerType === readerType && l.accessType === accessType);
      const expected = (1 + (env('clinicSawSummary') === 'yes' ? 1 : 0)) + 1 + (env('doctorSawSummary') === 'yes' ? 1 : 0);
      pm.test('clinic + doctor lines', () => pm.expect(total).to.eql(expected));
      pm.test('the doctor first, as "Dr. Han Seo-yeon"', () => pm.expect([(list[0] || {}).readerType, (list[0] || {}).readerName]).to.eql(['DOCTOR', 'Dr. Han Seo-yeon']));
      pm.test('no ADMIN line', () => pm.expect(list.filter((l) => l.readerType === 'ADMIN')).to.be.empty);
      pm.environment.set('accessTotal', String(total));
    language: text/javascript
order: 23000
