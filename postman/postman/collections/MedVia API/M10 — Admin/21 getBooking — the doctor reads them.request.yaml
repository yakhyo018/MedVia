$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{doctorToken}}
body:
  type: graphql
  content:
    query: |-
      query G($id: String!) { getBooking(bookingId: $id) { _id bookingCode bookingStatus bookingQuestionnaire { originalLang answers { question answer } } bookingAiSummary } }
    variables: |-
      { "id": "{{bookingId}}" }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.environment.set('doctorSawSummary', (gql.getBooking || {}).bookingAiSummary ? 'yes' : 'no');
    language: text/javascript
order: 21000
