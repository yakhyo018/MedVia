$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      query F($input: AuditFeedInquiry!) { getAuditFeedByAdmin(input: $input) { list { _id auditAction auditGroup auditRefId auditNote memberId adminName createdAt } metaCounter { total } } }
    variables: |-
      { "input": { "page": 1, "limit": 101 } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test("refused: limit must not be greater than 100", () => pm.expect(msg).to.include("limit must not be greater than 100"));
    language: text/javascript
order: 61000
