$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      query L($input: BookingsInquiry!) { getBookings(input: $input) { list { _id bookingCode } metaCounter { total } } }
    variables: |-
      { "input": { "page": 1, "limit": 50, "memberId": "{{patientId}}" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      pm.test('Feride has one', () => pm.expect((((gql.getBookings || {}).metaCounter || [])[0] || {}).total).to.eql(1));
    language: text/javascript
order: 35000
