$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      query A($input: AccessLogsInquiry!) { getAccessLogsByAdmin(input: $input) { list { _id accessType bookingId bookingCode patientId readerId readerType readerName createdAt } metaCounter { total } } }
    variables: |-
      { "input": { "page": 1, "limit": 50, "bookingId": "{{bookingId}}" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const env = (key) => pm.environment.get(key);
      const res = gql.getMyAccessLogs || gql.getAccessLogsByAdmin || {};
      const list = res.list || [];
      const total = ((res.metaCounter || [])[0] || {}).total || 0;
      const ofType = (readerType, accessType) => list.filter((l) => l.readerType === readerType && l.accessType === accessType);
      pm.test("the clinic's reading is listed", () => pm.expect(list.some((l) => l.readerType === 'AGENT')).to.be.true);
      pm.test('no ADMIN line', () => pm.expect(list.filter((l) => l.readerType === 'ADMIN')).to.be.empty);
    language: text/javascript
order: 24000
