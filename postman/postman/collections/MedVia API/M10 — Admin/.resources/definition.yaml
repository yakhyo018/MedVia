description: "The admin's work, each API in the component it belongs to. Access log: every time the questionnaire or the AI summary is decrypted for the clinic or the doctor, one line — never for the patient's own reading, never for the admin (who gets no medical data at all); the patient sees the list (getMyAccessLogs), the admin by patient or booking. Audit log: blocking, unblocking, publishing, unpublishing and removing a notice are decisions (one line each, none for a repeat); the feed filters by group, action, admin and date. User detail with activity counts and last bookings; booking search by code or patient name (escaped) and by member; the dashboard's booking stats and batch status — and the whole dashboard as one GraphQL request. Needs ADMIN_EMAIL / ADMIN_PASSWORD, MEDICAL_ENC_KEY, ENABLE_TEST_SUPPORT=true and AI_PROVIDER=fake."
