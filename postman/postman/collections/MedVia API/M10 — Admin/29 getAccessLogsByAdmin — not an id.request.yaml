$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{adminToken}}
body:
  type: graphql
  content:
    query: |-
      query A($input: AccessLogsInquiry!) { getAccessLogsByAdmin(input: $input) { list { _id accessType bookingId bookingCode patientId readerId readerType readerName createdAt } metaCounter { total } } }
    variables: |-
      { "input": { "page": 1, "limit": 50, "patientId": "nope" } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test("refused: patientId must be a mongodb id", () => pm.expect(msg).to.include("patientId must be a mongodb id"));
    language: text/javascript
order: 29000
