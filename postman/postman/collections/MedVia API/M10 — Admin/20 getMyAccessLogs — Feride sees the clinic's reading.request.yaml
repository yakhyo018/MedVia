$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{patientToken}}
body:
  type: graphql
  content:
    query: |-
      query A($input: OrdinaryInquiry!) { getMyAccessLogs(input: $input) { list { _id accessType bookingId bookingCode patientId readerId readerType readerName createdAt } metaCounter { total } } }
    variables: |-
      { "input": { "page": 1, "limit": 50 } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test('no GraphQL errors', () => pm.expect(body.errors, msg).to.be.undefined);
      const env = (key) => pm.environment.get(key);
      const res = gql.getMyAccessLogs || gql.getAccessLogsByAdmin || {};
      const list = res.list || [];
      const total = ((res.metaCounter || [])[0] || {}).total || 0;
      const ofType = (readerType, accessType) => list.filter((l) => l.readerType === readerType && l.accessType === accessType);
      pm.test('one line per decrypted part', () => pm.expect(total).to.eql((1 + (env('clinicSawSummary') === 'yes' ? 1 : 0))));
      const answers = ofType('AGENT', 'ANSWERS')[0] || {};
      pm.test('ANSWERS, by the clinic, named', () => pm.expect([answers.readerName, answers.readerId === undefined]).to.eql(['Admin Test Clinic ' + env('stamp'), false]));
      pm.test('the booking code is on the line', () => pm.expect([answers.bookingId, answers.bookingCode]).to.eql([env('bookingId'), env('bookingCode')]));
      pm.test('AI_SUMMARY only when the clinic got one', () => pm.expect(ofType('AGENT', 'AI_SUMMARY').length).to.eql(env('clinicSawSummary') === 'yes' ? 1 : 0));
    language: text/javascript
order: 20000
