$kind: http-request
url: '{{baseUrl}}/graphql'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{clinicToken}}
body:
  type: graphql
  content:
    query: |-
      query A($input: OrdinaryInquiry!) { getMyAccessLogs(input: $input) { list { _id accessType bookingId bookingCode patientId readerId readerType readerName createdAt } metaCounter { total } } }
    variables: |-
      { "input": { "page": 1, "limit": 50 } }
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();
      const gql = body.data || {};
      const err = (body.errors && body.errors[0]) || {};
      const msg = err.message || '';
      const code = (err.extensions && err.extensions.code) || '';
      pm.test("refused: Allowed only for members with specific roles!", () => pm.expect(msg).to.include("Allowed only for members with specific roles!"));
      pm.test('code FORBIDDEN', () => pm.expect(code).to.eql('FORBIDDEN'));
    language: text/javascript
order: 27000
