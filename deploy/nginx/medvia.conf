# medvia.tech (Next.js) + api.medvia.tech (NestJS GraphQL, uploads, Socket.IO).
# One Let's Encrypt certificate covers medvia.tech, www.medvia.tech and api.medvia.tech.
# www redirects to the apex: one origin for CORS (FRONTEND_URL) and the refresh cookie's site.

map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

# Port 80: Let's Encrypt challenges, everything else to HTTPS.
server {
	listen 80;
	server_name medvia.tech www.medvia.tech api.medvia.tech;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	http2 on;
	server_name www.medvia.tech;
	ssl_certificate /etc/letsencrypt/live/medvia.tech/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/medvia.tech/privkey.pem;
	return 301 https://medvia.tech$request_uri;
}

server {
	listen 443 ssl;
	http2 on;
	server_name medvia.tech;
	ssl_certificate /etc/letsencrypt/live/medvia.tech/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/medvia.tech/privkey.pem;
	add_header Strict-Transport-Security "max-age=31536000" always;

	location / {
		proxy_pass http://web:4000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}

server {
	listen 443 ssl;
	http2 on;
	server_name api.medvia.tech;
	ssl_certificate /etc/letsencrypt/live/medvia.tech/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/medvia.tech/privkey.pem;
	add_header Strict-Transport-Security "max-age=31536000" always;
	# Image uploads are at most 5 MB (the API's own limit).
	client_max_body_size 8m;

	# Socket.IO (namespace /live): an upgraded, long-lived connection.
	location /socket.io/ {
		proxy_pass http://api:3000;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 1h;
	}

	location / {
		proxy_pass http://api:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		# The API trusts one proxy hop (`trust proxy` 1): the throttle sees the real client.
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		# The assistant's answer can take ~30 s (several model calls).
		proxy_read_timeout 90s;
	}
}
